<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#232838" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta
      name="description"
      content="Groundplane is a self-hosted control plane: navigate Tenant → Project → Environment → Services, then deploy, roll back, and back up without hand-written shell scripts."
    />
    <title>Groundplane — Self-hosted control plane</title>
    <script>
      try {
        if (localStorage.getItem('groundplane-theme') === 'light') {
          document.documentElement.classList.remove('dark')
        }
      } catch {}
    </script>
  </head>
  <body class="bg-background font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
