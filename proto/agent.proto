// The Controller <-> Agent machine contract. This .proto is the single
// source of truth — both sides compile against it, so a contract change
// is a build error, never a silent runtime mismatch. See mvp.md, "Agent
// channel (locked): gRPC + protobuf".
//
// One long-lived bidirectional stream per agent, INITIATED BY THE AGENT
// (dial-out, pull model): the Agent signals Ready and the Controller
// assigns work; nothing is ever pushed to an unconnected agent.
syntax = "proto3";

package groundplane.agent.v1;

option go_package = "github.com/AlanD20/groundplane/proto/agentpb";

import "google/protobuf/timestamp.proto";

// AgentChannel is the one authenticated bidirectional stream. The Agent
// sends Authenticate as the first message and keeps the stream open for the
// life of the process, reconnecting with exponential backoff on drop.
service AgentChannel {
  rpc Connect(stream AgentMessage) returns (stream ControllerMessage);
}

message Authenticate {
  string agent_id = 1;
  bytes token = 2; // exactly 32 decoded bytes; never the base64url materialization
}

message AgentConfig {
  int32 pull_interval_seconds = 1;
  int32 max_concurrent_tasks = 2;
  map<string, string> labels = 3;
}

// ---- Agent -> Controller ----

message AgentMessage {
  oneof payload {
    Authenticate authenticate = 1; // mandatory first message; no config or work is served before it succeeds
    Ready ready = 2;               // idle Ready IS the heartbeat; authoritative for dead-agent detection
    TaskEvent task_event = 3;      // step progress + streamed output
    ObservedState observed_state = 4; // drift-detection feed for reconciliation
    TaskAck task_ack = 5;          // completed / failed
  }
}

message Ready {
  int32 capacity = 1; // free worker-pool slots
}

message TaskEvent {
  string task_id = 1;
  bytes plan_hash = 2; // exactly 32 immutable SHA-256 bytes
  string step_id = 3;
  uint32 attempt = 4; // one-based execution attempt for this step
  uint64 ordinal = 5; // one-based stable delivery identity within the step attempt
  TaskState state = 6;
  bytes chunk = 7; // streamed log/output, proxied through the Controller with a short-lived buffer, never persisted in etcd
}

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_PENDING = 1;
  TASK_STATE_RUNNING = 2;
  TASK_STATE_COMPLETED = 3;
  TASK_STATE_FAILED = 4;
  TASK_STATE_ABORTED = 5;
  TASK_STATE_TIMED_OUT = 6;
}

message ObservedState {
  repeated ObservedProject projects = 1;
}

message ObservedProject {
  string project_name = 1;
  google.protobuf.Timestamp observed_at = 2;
  repeated ObservedContainer containers = 3;
  repeated ObservedNetwork networks = 4;
  repeated ObservedVolume volumes = 5;
  repeated ObservedCollision collisions = 6;
}

message ObservedContainer {
  string container_id = 1;
  string name = 2;
  string service_id = 3;
  string image_reference = 4;
  string image_id = 5;
  ObservedContainerState state = 6;
  ObservedContainerHealth health = 7;
  optional int32 exit_code = 8;
  repeated LabelPair labels = 9;
}

enum ObservedContainerState {
  OBSERVED_CONTAINER_STATE_UNSPECIFIED = 0;
  OBSERVED_CONTAINER_STATE_CREATED = 1;
  OBSERVED_CONTAINER_STATE_RUNNING = 2;
  OBSERVED_CONTAINER_STATE_EXITED = 3;
  OBSERVED_CONTAINER_STATE_DEAD = 4;
}

enum ObservedContainerHealth {
  OBSERVED_CONTAINER_HEALTH_UNSPECIFIED = 0;
  OBSERVED_CONTAINER_HEALTH_NONE = 1;
  OBSERVED_CONTAINER_HEALTH_STARTING = 2;
  OBSERVED_CONTAINER_HEALTH_HEALTHY = 3;
  OBSERVED_CONTAINER_HEALTH_UNHEALTHY = 4;
}

message ObservedNetwork {
  string network_id = 1;
  string name = 2;
  repeated LabelPair labels = 3;
}

message ObservedVolume {
  string name = 1;
  bytes mountpoint_sha256 = 2;
  repeated LabelPair labels = 3;
}

message ObservedCollision {
  ObservedCollisionKind kind = 1;
  string name = 2;
}

enum ObservedCollisionKind {
  OBSERVED_COLLISION_KIND_UNSPECIFIED = 0;
  OBSERVED_COLLISION_KIND_CONTAINER = 1;
  OBSERVED_COLLISION_KIND_NETWORK = 2;
  OBSERVED_COLLISION_KIND_VOLUME = 3;
}

message TaskAck {
  string task_id = 1;
  bytes plan_hash = 2; // exactly 32 immutable SHA-256 bytes
  TaskTerminal terminal = 3;
  int32 exit_code = 4;
  bytes result = 5; // opaque task-type-specific result
}

enum TaskTerminal {
  TASK_TERMINAL_UNSPECIFIED = 0;
  TASK_TERMINAL_COMPLETED = 1;
  TASK_TERMINAL_FAILED = 2;
  TASK_TERMINAL_TIMED_OUT = 3;
  TASK_TERMINAL_ABORTED = 4;
}

// ---- Controller -> Agent ----

message ControllerMessage {
  oneof payload {
    TaskAssignment task_assignment = 1; // the full procedure: steps, params, timeout
    TaskAbort task_abort = 2;           // cancel in-flight work NOW
    ConfigUpdate config_update = 3;     // applied on next Ready, no restart
    Shutdown shutdown = 4;
  }
}

message TaskAssignment {
  string task_id = 1;
  string operation_id = 2; // stable across retries
  string retry_of = 3;     // set iff this is a retry of a prior task_id
  ExecutionPlan plan = 4;  // complete authoritative procedure
  int32 timeout_seconds = 5;
}

message ExecutionPlan {
  uint32 schema = 1; // exactly 1
  string plan_id = 2;
  bytes plan_hash = 3; // SHA-256 of deterministic serialization with this field cleared
  uint64 render_generation = 4;
  PlanOperation operation = 5;
  string target_id = 6;
  repeated ComposeArtifact artifacts = 7;
  repeated ExecutionStep steps = 8;
}

enum PlanOperation {
  PLAN_OPERATION_UNSPECIFIED = 0;
  PLAN_OPERATION_RECONCILE = 1;
  PLAN_OPERATION_DEPLOY = 2;
  PLAN_OPERATION_ROLLBACK = 3;
  PLAN_OPERATION_START = 4;
  PLAN_OPERATION_STOP = 5;
  PLAN_OPERATION_DESTROY = 6;
  PLAN_OPERATION_REMOVE = 7;
  PLAN_OPERATION_COMPONENT_APPLY = 8;
}

message ComposeArtifact {
  string artifact_id = 1;
  ComposeOwnerKind owner_kind = 2;
  string owner_id = 3; // environment id, or empty for platform
  string project_name = 4;
  bytes canonical_yaml = 5;
  bytes yaml_sha256 = 6;
  string authorized_volume_dir = 7; // empty for platform
  repeated ComposeService services = 8;
  repeated ComposeNetwork networks = 9;
  repeated ComposeVolume volumes = 10;
}

enum ComposeOwnerKind {
  COMPOSE_OWNER_KIND_UNSPECIFIED = 0;
  COMPOSE_OWNER_KIND_ENVIRONMENT = 1;
  COMPOSE_OWNER_KIND_PLATFORM = 2;
}

message ComposeService {
  string service_id = 1;
  string compose_name = 2;
  repeated LabelPair expected_labels = 3;
  uint32 expected_replicas = 4;
  bool has_healthcheck = 5;
}

message ComposeNetwork {
  string network_id = 1;
  string compose_name = 2;
  string docker_name = 3;
  repeated LabelPair expected_labels = 4;
}

message ComposeVolume {
  string volume_id = 1;
  string compose_name = 2;
  string docker_name = 3;
  repeated LabelPair expected_labels = 4;
}

message LabelPair {
  string key = 1;
  string value = 2;
}

message ExecutionStep {
  string step_id = 1;
  uint32 timeout_seconds = 2;
  oneof payload {
    ComposeApply compose_apply = 3;
    ComposeStop compose_stop = 4;
    ComposeRemove compose_remove = 5;
    WaitHealthy wait_healthy = 6;
  }
}

message ComposeApply {
  string artifact_id = 1;
  repeated string service_ids = 2;
  bool full_reconcile = 3;
}

message ComposeStop {
  string artifact_id = 1;
  repeated string service_ids = 2;
  uint32 grace_seconds = 3;
}

message ComposeRemove {
  string artifact_id = 1;
  repeated string service_ids = 2;
  bool whole_project = 3;
}

message WaitHealthy {
  string artifact_id = 1;
  repeated string service_ids = 2;
}

// ComposeHelperRequest is the single length-framed stdin message accepted by
// the static compose-helper Agent-binary mode.
message ComposeHelperRequest {
  uint32 schema = 1; // exactly 1
  string task_id = 2;
  string operation_id = 3;
  ExecutionPlan plan = 4;
  string step_id = 5;
  uint32 timeout_seconds = 6; // remaining bounded execution time
}

message ComposeHelperResponse {
  uint32 schema = 1; // exactly 1
  ComposeHelperOutcome outcome = 2;
  int32 exit_code = 3;
  ComposeHelperDiagnostic diagnostic = 4;
}

enum ComposeHelperOutcome {
  COMPOSE_HELPER_OUTCOME_UNSPECIFIED = 0;
  COMPOSE_HELPER_OUTCOME_COMPLETED = 1;
  COMPOSE_HELPER_OUTCOME_FAILED = 2;
}

enum ComposeHelperDiagnostic {
  COMPOSE_HELPER_DIAGNOSTIC_UNSPECIFIED = 0;
  COMPOSE_HELPER_DIAGNOSTIC_NONE = 1;
  COMPOSE_HELPER_DIAGNOSTIC_CONFIG_REJECTED = 2;
  COMPOSE_HELPER_DIAGNOSTIC_COMPOSE_FAILED = 3;
}

message TaskAbort {
  string task_id = 1;
  string reason = 2;
}

message ConfigUpdate {
  AgentConfig agent_config = 1;
}

message Shutdown {}
