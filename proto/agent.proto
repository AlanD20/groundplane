message ExecutionStep {
  reserved 13, 14, 15;
  reserved "backup_source_capture", "backup_artifact_prune";
  string step_id = 1;
  uint32 timeout_seconds = 2;
  oneof payload {
    ComposeApply compose_apply = 3;
    ComposeStop compose_stop = 4;
    ComposeRemove compose_remove = 5;
    WaitHealthy wait_healthy = 6;
    EnvironmentDirectoryCreate environment_directory_create = 7;
    MaterializeFile materialize_file = 8;
    ManagedVolumeDirectoriesEnsure managed_volume_directories_ensure = 9;
    EnvironmentDirectoryRemove environment_directory_remove = 10;
    AdapterProcedure adapter_procedure = 11;
    ManagedNetworkRemove managed_network_remove = 12;
    ComposeWorkloadApply compose_workload_apply = 16;
    WaitWorkloadHealthy wait_workload_healthy = 17;
    ServiceProxySwitch service_proxy_switch = 18;
    ServiceProxyProbe service_proxy_probe = 19;
    ServiceProxyCompensate service_proxy_compensate = 20;
    ServiceRecreateAcknowledge service_recreate_acknowledge = 21;
    ServiceRecreateProbe service_recreate_probe = 22;
    ServiceRecreateCompensate service_recreate_compensate = 23;
    ManagedVolumeRemove managed_volume_remove = 24;
    ManagedVolumeDirectoryRemove managed_volume_directory_remove = 25;
    ComponentApply component_apply = 26;
    HostResolutionApply host_resolution_apply = 27;
    HostResolutionRestore host_resolution_restore = 28;
    RunScript run_script = 29;
    CandidateRestorationProbe candidate_restoration_probe = 32;
    CandidateRestorationCompensate candidate_restoration_compensate = 33;
    ManagedNetworkEnsure managed_network_ensure = 34;
    ManagedVolumeEnsure managed_volume_ensure = 35;
    BackingHookProcedure backing_hook_procedure = 36;
    // Immutable typed Backup step input. Dispatch wraps these exact steps in
    // the assignment-specific BackupTaskAuthority; no source reconstruction.
    BackupStepAuthority backup_step = 37;
  }
  ExecutionStepPolicy policy = 30;
  string prerequisite_step_id = 31;
}

// Resource-only preparation of one owned network from an immutable artifact.
message ManagedNetworkEnsure {
  string artifact_id = 1;
  string network_id = 2;
}

// Resource-only preparation of one owned managed bind volume before consumers.
// The directory leaf is prepared separately by ManagedVolumeDirectoriesEnsure.
message ManagedVolumeEnsure {
  string artifact_id = 1;
  string volume_id = 2;
  // Read-only verification: absence or divergent ownership fails; never create.
  bool require_existing = 3;
}

