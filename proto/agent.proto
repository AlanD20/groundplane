  EXECUTION_STEP_POLICY_RELEASE_FAILURE_HOOK = 7;
}

// BackupSourceCapture is one immutable source attempt in policy order. It
// carries only Controller-authorized control evidence. Credentials, Entry
// values, artifact bytes, and provider responses never enter the plan or
// ordinary Task messages.
message BackupSourceCapture {
  string source_id = 1;
  uint64 source_revision = 2;
  string target_id = 3;
  uint64 target_revision = 4;
  string point_id = 5;
  string connector_id = 6;
  uint64 connector_revision = 7;
  BackupSourceFormat source_format = 8;
  BackupEncryption encryption = 9;
  uint64 key_era = 10;       // positive exactly when encryption is age
  string age_recipient = 11; // public recipient; empty when encryption is none
  oneof source {
    BackupAttachSource attach = 12;
    BackupConfigSource config = 13;
    BackupVolumeSource volume = 14;
  }
  BackupUploadAuthority upload = 15;
}

