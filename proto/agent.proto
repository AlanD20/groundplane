}

message BackupVolumeSource {
  repeated BackupVolumeService services = 1; // uniquely sorted by service_id
  string artifact_id = 2;
  bytes artifact_sha256 = 3;
  uint64 artifact_revision = 4;
  uint64 projection_root = 5;
  uint64 render_generation = 6;
  string compose_volume_key = 7;
  string docker_volume_name = 8;
  string authorized_volume_dir = 9;
}

