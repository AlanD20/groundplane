  bytes stored_sha256 = 2;
  bytes decoded_sha256 = 3;
}

message BackupVolumeTreeStagedCheckpoint {
  string point_id = 1;
  bytes staged_tree_manifest_sha256 = 2;
}

message BackupVolumeTreeExchangedCheckpoint {
  string point_id = 1;
  bytes live_tree_manifest_sha256 = 2;
