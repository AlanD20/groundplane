message BackupRecoveryAck {
  WorkAttemptIdentity attempt = 1;
  WorkInputReference evidence = 2;
  google.protobuf.Timestamp started_at = 3;
  google.protobuf.Timestamp finished_at = 4;
}

message BackupWorkCheckpointRequest {
  WorkAttemptIdentity attempt = 1;
  uint32 source_ordinal = 2;
  uint64 checkpoint_sequence = 3;
  CheckpointFence preceding_checkpoint = 4;
  oneof checkpoint {
    BackupArtifactPrepared artifact_prepared = 20;
    BackupUploadVerified upload_verified = 21;
    BackupSourceCleanupCompleted source_cleanup_completed = 22;
    BackupPostgresContainerObserved postgres_container_observed = 23;
    BackupPostgresDumpStart postgres_dump_start = 24;
    BackupPostgresRestoreApplyStartCheckpoint postgres_restore_apply_start = 25;
    BackupRestoreArtifactValidated restore_artifact_validated = 26;
    BackupConfigCheckpoint config = 27;
    BackupVolumeCheckpoint volume = 28;
    BackupPruneObjectDeleted prune_object_deleted = 29;
    BackupPostgresRestoreVerified postgres_restore_verified = 30;
    BackupPostgresServiceProgress postgres_service_progress = 31;
    BackupUploadCompleted upload_completed = 32;
    BackupMySQLContainerObserved mysql_container_observed = 33;
    BackupMySQLDumpStart mysql_dump_start = 34;
    BackupMySQLRestoreApplyStartCheckpoint mysql_restore_apply_start = 35;
    BackupMySQLRestoreVerified mysql_restore_verified = 36;
    BackupMySQLServiceProgress mysql_service_progress = 37;
    BackupDatabaseConsumerRecovery database_consumer_recovery = 38;
  }
}

message BackupWorkCompletionRequest {
  WorkAttemptIdentity attempt = 1;
  WorkInputReference evidence = 2;
}

// Sent only after the source executor has stopped and cannot start another
