message BackupArtifactPrune {
  uint32 ordinal = 1;
  string prune_operation_id = 2;
  uint64 prune_revision = 3;
  string point_id = 4;
  uint64 point_revision = 5;
  string source_id = 6;
  uint64 source_revision = 7;
  string environment_id = 8;
  uint64 environment_revision = 9;
  string connector_id = 10;
  uint64 connector_revision = 11;
  string connector_endpoint = 12;
  string connector_bucket = 13;
  string connector_prefix = 14;
  string connector_region = 15;
  BackupS3Addressing connector_addressing = 16;
  string protected_object_key = 17;
  uint64 stored_size_bytes = 18;
  bytes stored_sha256 = 19;
}

enum BackupSourceFormat {
  BACKUP_SOURCE_FORMAT_UNSPECIFIED = 0;
  BACKUP_SOURCE_FORMAT_POSTGRES_CUSTOM_V1 = 1;
  BACKUP_SOURCE_FORMAT_ENVIRONMENT_CONFIG_V1 = 2;
  BACKUP_SOURCE_FORMAT_VOLUME_TAR_V1 = 3;
}

