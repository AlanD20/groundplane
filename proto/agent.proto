}

message BackupSecretSlotHeader {
  uint64 total_bytes = 1;
  uint32 chunk_count = 2;
}

message BackupSecretSlotChunk {
  uint32 sequence = 1;
  bytes content = 2; // at most 32768 transient bytes, cleared after consumption
}

message BackupSecretSlotEnd {
  uint32 chunk_count = 1;
}

