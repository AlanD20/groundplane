// The Controller <-> Agent machine contract. This .proto is the single
// source of truth — both sides compile against it, so a contract change
// is a build error, never a silent runtime mismatch. See mvp.md, "Agent
// channel (locked): gRPC + protobuf".
//
// One long-lived bidirectional stream per agent, INITIATED BY THE AGENT
// (dial-out, pull model): the Agent signals Ready and the Controller
// assigns work; nothing is ever pushed to an unconnected agent.
syntax = "proto3";

package groundplane.agent.v1;

option go_package = "github.com/AlanD20/groundplane/proto/agentpb";

import "google/protobuf/timestamp.proto";

// AgentChannel is the one authenticated bidirectional stream. The Agent
// sends Authenticate as the first message and keeps the stream open for the
// life of the process, reconnecting with exponential backoff on drop.
service AgentChannel {
  rpc Connect(stream AgentMessage) returns (stream ControllerMessage);
}

message Authenticate {
  string agent_id = 1;
  bytes token = 2; // exactly 32 decoded bytes; never the base64url materialization
  uint32 execution_plan_schema = 3; // exactly schema one
  bytes process_generation = 4; // exactly 16 bytes, distinct from durable Agent generation
  bytes postgres16_managed_release_sha256 = 5; // exactly 32 bytes
}

message AgentConfig {
  int32 pull_interval_seconds = 1;
  int32 max_concurrent_tasks = 2;
  repeated AgentLabel labels = 3; // sorted by unique key
}

message AgentLabel {
  string key = 1;
  string value = 2;
}

// ---- Agent -> Controller ----

message AgentMessage {
  oneof payload {
    Authenticate authenticate = 1; // mandatory first message; no config or work is served before it succeeds
    Ready ready = 2;               // idle Ready IS the heartbeat; authoritative for dead-agent detection
    TaskEvent task_event = 3;      // step progress + streamed output
    ObservedState observed_state = 4; // drift-detection feed for reconciliation
    TaskAck task_ack = 5;          // completed / failed
    BackupCheckpointRequest backup_checkpoint_request = 6;
    LogEvent log_event = 7;
    LogEnd log_end = 8;
    LogReady log_ready = 9;
    ScriptCheckpointRequest script_checkpoint_request = 10;
    WorkloadImageResolutionResult workload_image_resolution_result = 11;
    VolumeRemovalCheckpointRequest volume_removal_checkpoint_request = 12;
    ServiceObservationResult service_observation_result = 13;
    BackingHookCheckpointRequest backing_hook_checkpoint_request = 14;
    BackupConfigTransfer backup_config_transfer = 32;
    BackupConfigCredit backup_config_credit = 33;
    BackupStagingInventory backup_staging_inventory = 34;
    BackupStagingRecoveryAck backup_staging_recovery_ack = 35;
    BackupVolumeManifestTransfer backup_volume_manifest_transfer = 36;
    BackupVolumeManifestAckCredit backup_volume_manifest_ack_credit = 37;
    TaskTerminalReceiptApplied task_terminal_receipt_applied = 38;
    TaskTerminalAssignmentRetired task_terminal_assignment_retired = 39;
  }
}

message Ready {
  int32 capacity = 1; // free worker-pool slots
  string version = 2; // exact Agent binary build version
  string operating_system = 3;
  string architecture = 4;
  string architecture_variant = 5;
  optional bool terminal_delivery_clean = 6; // presence required, including false
}

// Ephemeral read-only image lookup; never an execution Task or pull request.
message WorkloadImageSelector {
  oneof selector {
    string requested_reference = 1;
    string local_image_id = 2;
  }
}

message ResolveWorkloadImages {
  string request_id = 1;
  repeated WorkloadImageSelector selectors = 2;
}

message WorkloadImageResolution {
  WorkloadImageSelector selector = 1;
  string local_image_id = 2;
}

message WorkloadImageResolutions {
  repeated WorkloadImageResolution resolutions = 1;
}

enum WorkloadImageResolutionFailureKind {
  WORKLOAD_IMAGE_RESOLUTION_FAILURE_KIND_UNSPECIFIED = 0;
  WORKLOAD_IMAGE_RESOLUTION_FAILURE_KIND_NOT_FOUND = 1;
  WORKLOAD_IMAGE_RESOLUTION_FAILURE_KIND_IDENTITY_MISMATCH = 2;
  WORKLOAD_IMAGE_RESOLUTION_FAILURE_KIND_OBSERVATION_FAILED = 3;
}

message WorkloadImageResolutionFailure {
  optional uint32 selector_ordinal = 1;
  WorkloadImageResolutionFailureKind kind = 2;
}

message WorkloadImageResolutionResult {
  string request_id = 1;
  oneof outcome {
    WorkloadImageResolutions success = 2;
    WorkloadImageResolutionFailure failure = 3;
  }
}

// Ephemeral workload-only read. Targets are frozen by the Controller from the
// current serving Release; this message conveys no mutation or secret authority.
message ServiceObservationTarget {
  string environment_id = 1;
  string service_id = 2;
  string release_id = 3;
  string plan_id = 4;
  uint64 render_generation = 5;
  string compose_name = 6;
  string runtime_role = 7; // exactly singleton, slot, or backing (no Release)
  string slot = 8; // empty for singleton; blue or green for slot
  string proxy_compose_name = 9; // empty for a portless Service
  string proxy_plan_id = 10;
  uint64 proxy_render_generation = 11;
  bytes proxy_config_sha256 = 12; // exact acknowledged active Caddy configuration
}

message ObserveServices {
  string request_id = 1; // raw ULID; correlated with the exact authenticated session
  repeated ServiceObservationTarget targets = 2;
}

message CancelServiceObservation {
  string request_id = 1; // cancel only this exchange on this connection
}

// Disjoint bins; neither desired state nor healthcheck output is returned.
message ServiceReplicaCounts {
  uint32 running = 1; // running without a healthcheck
  uint32 healthy = 2;
  uint32 starting = 3; // running with a starting healthcheck
  uint32 unhealthy = 4;
  uint32 transitional = 5; // created, paused, restarting or removing
  uint32 stopped = 6; // exited zero
  uint32 failed = 7; // dead or exited nonzero
}

message ServiceObservationRow {
  string service_id = 1;
  string release_id = 2;
  oneof outcome {
    ServiceReplicaCounts replicas = 3;
    bool unavailable = 4; // must be true; no partial counts or diagnostic text
  }
  ServiceProxyObservationState proxy_state = 5;
  repeated ServiceContainerObservation containers = 6;
}

// Selected workload metadata only; no environment, commands or healthcheck output.
message ServiceContainerObservation {
  string id = 1;
  string name = 2;
  string image = 3;
  string state = 4;
  string health = 5;
  uint32 replica = 6;
}

enum ServiceProxyObservationState {
  SERVICE_PROXY_OBSERVATION_STATE_UNSPECIFIED = 0; // portless or unavailable
  SERVICE_PROXY_OBSERVATION_STATE_MATCHING = 1;
  SERVICE_PROXY_OBSERVATION_STATE_MISSING = 2;
  SERVICE_PROXY_OBSERVATION_STATE_STOPPED = 3;
  SERVICE_PROXY_OBSERVATION_STATE_CONFIG_MISMATCH = 4;
}

message ServiceObservationResult {
  string request_id = 1;
  repeated ServiceObservationRow observations = 2;
}

message TaskEvent {
  string task_id = 1;
  bytes plan_hash = 2; // exactly 32 immutable SHA-256 bytes
  string step_id = 3;
  uint32 execution_epoch = 4; // exact durable assignment execution epoch
  uint64 ordinal = 5; // one-based stable delivery identity within the step attempt
  TaskState state = 6;
  bytes chunk = 7; // streamed log/output, proxied through the Controller with a short-lived buffer, never persisted in etcd
  string assignment_id = 8;
}

message TaskEventAck {
  string task_id = 1;
  bytes plan_hash = 2;
  string step_id = 3;
  uint32 execution_epoch = 4;
  uint64 ordinal = 5;
  TaskState state = 6;
  string assignment_id = 7;
}

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_PENDING = 1;
  TASK_STATE_RUNNING = 2;
  TASK_STATE_COMPLETED = 3;
  TASK_STATE_FAILED = 4;
  TASK_STATE_ABORTED = 5;
  TASK_STATE_TIMED_OUT = 6;
}

message ObservedState {
  repeated ObservedProject projects = 1;
  string snapshot_id = 2;
  uint32 batch_ordinal = 3;
  optional bool final_batch = 4; // presence required
}

message ObservedProject {
  string project_name = 1;
  google.protobuf.Timestamp observed_at = 2;
  repeated ObservedContainer containers = 3;
  repeated ObservedNetwork networks = 4;
  repeated ObservedVolume volumes = 5;
  repeated ObservedCollision collisions = 6;
}

message ObservedContainer {
  string container_id = 1;
  string name = 2;
  string service_id = 3;
  string image_reference = 4;
  string image_id = 5;
  ObservedContainerState state = 6;
  ObservedContainerHealth health = 7;
  optional int32 exit_code = 8;
  repeated LabelPair labels = 9;
}

enum ObservedContainerState {
  OBSERVED_CONTAINER_STATE_UNSPECIFIED = 0;
  OBSERVED_CONTAINER_STATE_CREATED = 1;
  OBSERVED_CONTAINER_STATE_RUNNING = 2;
  OBSERVED_CONTAINER_STATE_EXITED = 3;
  OBSERVED_CONTAINER_STATE_DEAD = 4;
}

enum ObservedContainerHealth {
  OBSERVED_CONTAINER_HEALTH_UNSPECIFIED = 0;
  OBSERVED_CONTAINER_HEALTH_NONE = 1;
  OBSERVED_CONTAINER_HEALTH_STARTING = 2;
  OBSERVED_CONTAINER_HEALTH_HEALTHY = 3;
  OBSERVED_CONTAINER_HEALTH_UNHEALTHY = 4;
}

message ObservedNetwork {
  string network_id = 1;
  string name = 2;
  repeated LabelPair labels = 3;
}

message ObservedVolume {
  string name = 1;
  bytes mountpoint_sha256 = 2;
  repeated LabelPair labels = 3;
}

message ObservedCollision {
  ObservedCollisionKind kind = 1;
  string name = 2;
  string compose_service_name = 3;
  string component_id = 4;
  string service_id = 5;
}

enum ObservedCollisionKind {
  OBSERVED_COLLISION_KIND_UNSPECIFIED = 0;
  OBSERVED_COLLISION_KIND_CONTAINER = 1;
  OBSERVED_COLLISION_KIND_NETWORK = 2;
  OBSERVED_COLLISION_KIND_VOLUME = 3;
}

message TaskAck {
  string task_id = 1;
  bytes plan_hash = 2; // exactly 32 immutable SHA-256 bytes
  TaskTerminal terminal = 3;
  int32 exit_code = 4;
  oneof result {
    ComposeTaskResult compose_result = 5;
    EnvironmentDirectoryTaskResult environment_directory_result = 6;
    BackupTaskResult backup_result = 10;
  }
  string assignment_id = 7;
  uint32 execution_epoch = 8;
  bytes release_recovery_record_sha256 = 9;
  uint64 assignment_generation = 11;
}

message BackupTaskResult {
  string failed_step_id = 1;
  optional bool recovery_required = 2; // presence required
}

message ComposeTaskResult {
  repeated ObservedProject projects = 1;
  string failed_step_id = 2;
  ComposeHelperDiagnostic diagnostic = 3;
  bool reconciliation_required = 4;
  repeated ServiceProxyEvidence proxy_evidence = 5;
  repeated ServiceRecreateEvidence recreate_evidence = 6;
  DNSResolverObservationEvidence dns_resolver_candidate_observation = 7;
  DNSResolverObservationEvidence dns_resolver_rollback_observation = 8;
  CandidateAbsenceEvidence candidate_absence_evidence = 9;
}

message CandidateAbsenceEvidence {
  string assignment_id = 1;
  bytes plan_hash = 2;
  bytes authority_sha256 = 3;
  string compose_project_name = 4;
  string candidate_artifact_id = 5;
  repeated CandidateReleaseService candidates = 6;
  bool absence_proven = 7;
}

// DNSResolverObservationEvidence is the bounded full proof returned by a
// catalog-resolved DNS-resolution observation action. Every executable and
// endpoint used to produce it is fixed in the Agent's compiled catalog.
message DNSResolverObservationEvidence {
  string component_id = 1;
  string service_id = 2;
  string artifact_id = 3;
  bytes artifact_sha256 = 4;
  uint64 render_generation = 5;
  string image_reference = 6; // tagless repository@child-digest reference
  bytes verified_image_digest = 7; // exact selected child digest
  string listen_endpoint = 8;
  bytes reload_sha512 = 9;
  google.protobuf.Timestamp observed_at = 10;
  DNSQueryProof static_query = 11; // absent when the render has no static record
  DNSQueryProof catch_all_query = 12;
  repeated DNSQueryProof forwarder_queries = 13;
  string image_repository = 14;
  bytes image_index_digest = 15;
  string image_os = 16;
  string image_architecture = 17;
  bytes proof_sha256 = 18;
  string image_variant = 19;
  bytes image_config_digest = 20;
}

enum DNSQueryType {
  DNS_QUERY_TYPE_UNSPECIFIED = 0;
  DNS_QUERY_TYPE_A = 1;
  DNS_QUERY_TYPE_NS = 2;
}

message DNSAnswerRecord {
  string owner_name = 1;
  DNSQueryType type = 2;
  bytes ipv4 = 3; // exactly four bytes for A, empty for NS
  string name_server = 4; // canonical absolute name for NS, empty for A
}

message DNSForwardCounter {
  string upstream = 1; // normalized host:port selected from the rendered group
  uint32 rcode = 2;
  uint64 before = 3;
  uint64 after = 4;
}

message DNSQueryProof {
  string name = 1; // canonical absolute DNS name
  DNSQueryType type = 2;
  uint32 local_rcode = 3;
  bool recursion_available = 4;
  repeated DNSAnswerRecord answers = 5;
  string selected_upstream = 6; // empty only for a static query
  uint32 direct_rcode = 7; // meaningful iff selected_upstream is non-empty
  repeated DNSForwardCounter counters = 8; // every configured group endpoint/rcode series
  bool local_used_tcp = 9;
  bool direct_used_tcp = 10;
  uint32 attempts = 11;
}

message EnvironmentDirectoryTaskResult {
  string failed_step_id = 1;
  bytes next_cursor = 2;
  uint32 mutation_count = 3;
  bool complete = 4;
  bytes response_sha256 = 5;
}

enum TaskTerminal {
  TASK_TERMINAL_UNSPECIFIED = 0;
  TASK_TERMINAL_COMPLETED = 1;
  TASK_TERMINAL_FAILED = 2;
  TASK_TERMINAL_TIMED_OUT = 3;
  TASK_TERMINAL_ABORTED = 4;
}

// ---- Controller -> Agent ----

message ControllerMessage {
  oneof payload {
    TaskAssignment task_assignment = 1; // the full procedure: steps, params, timeout
    TaskAbort task_abort = 2;           // cancel in-flight work NOW
    ConfigUpdate config_update = 3;     // delivered at the first fully idle Ready; applied without process restart
    Shutdown shutdown = 4;
    MaterializationTransfer materialization_transfer = 5; // transient bytes; never durable Task or plan state
    BackupCheckpointAck backup_checkpoint_ack = 6;
    BackupSecretSlotTransfer backup_secret_slot_transfer = 7;
    LogSubscribe log_subscribe = 8;
    LogCancel log_cancel = 9;
    ManagedConfigTransfer managed_config_transfer = 10;
    ScriptCheckpointAck script_checkpoint_ack = 11;
    ResolveWorkloadImages resolve_workload_images = 12;
    VolumeRemovalCheckpointAck volume_removal_checkpoint_ack = 13;
    ObserveServices observe_services = 14;
    CancelServiceObservation cancel_service_observation = 15;
    BackingHookCheckpointAck backing_hook_checkpoint_ack = 16;
    LogCredit log_credit = 17;
    TaskEventAck task_event_ack = 22;
    BackupConfigTransfer backup_config_transfer = 32;
    BackupConfigCredit backup_config_credit = 33;
    BackupStagingRecoveryPlan backup_staging_recovery_plan = 34;
    BackupVolumeManifestTransfer backup_volume_manifest_transfer = 35;
    BackupVolumeManifestAckCredit backup_volume_manifest_ack_credit = 36;
    TaskTerminalReceiptAck task_terminal_receipt_ack = 37;
    TaskTerminalReceiptAppliedAck task_terminal_receipt_applied_ack = 38;
    BackupStagingRecoveryAckReceipt backup_staging_recovery_ack_receipt = 39;
    TaskTerminalAssignmentRetiredAck task_terminal_assignment_retired_ack = 40;
  }
}

message LogTarget {
  ServiceObservationTarget runtime = 1;
  string service_name = 2;
}

message LogSubscribe {
  string request_id = 1;
  repeated LogTarget targets = 2;
  uint32 tail = 3;
  bool follow = 4;
  uint32 initial_credit = 5;
}

message LogCancel {
  string request_id = 1;
}

message LogCredit {
  string request_id = 1;
  uint32 count = 2;
}

message LogReady {
  string request_id = 1;
}

enum LogStream {
  LOG_STREAM_UNSPECIFIED = 0;
  LOG_STREAM_STDOUT = 1;
  LOG_STREAM_STDERR = 2;
}

enum LogSlot {
  LOG_SLOT_UNSPECIFIED = 0;
  LOG_SLOT_BLUE = 1;
  LOG_SLOT_GREEN = 2;
  LOG_SLOT_SINGLETON = 3;
}

enum LogEndReason {
  LOG_END_REASON_UNSPECIFIED = 0;
  LOG_END_REASON_COMPLETE = 1;
  LOG_END_REASON_CANCELLED = 2;
  LOG_END_REASON_AVAILABILITY_FAILED = 3;
  LOG_END_REASON_SOURCE_FAILED = 4;
}

message LogEvent {
  string request_id = 1;
  string environment_id = 2;
  string service_id = 3;
  string service_name = 4;
  string release_id = 5;
  string container_id = 6;
  string container_name = 7;
  LogSlot slot = 8;
  LogStream stream = 9;
  google.protobuf.Timestamp timestamp = 10;
  string line = 11;
  bool truncated = 12;
}

message LogEnd {
  string request_id = 1;
  LogEndReason reason = 2;
}

// MaterializationTransfer is one ordered transient record for a metadata-only
// MaterializeFile step. The header repeats the sealed step metadata; content
// exists only in chunk records and is never part of ExecutionPlan.
message MaterializationTransfer {
  string task_id = 1;
  bytes plan_hash = 2;
  string step_id = 3;
  oneof record {
    MaterializationTransferHeader header = 4;
    MaterializationTransferChunk chunk = 5;
    MaterializationTransferEnd end = 6;
  }
  string assignment_id = 7;
}

message MaterializationTransferHeader {
  string artifact_id = 1;
  string materialization_id = 2;
  string environment_id = 3;
  uint64 render_generation = 4;
  string destination = 5;
  string service_id = 6;
  MaterializationOutputKind output_kind = 7;
  uint32 uid = 8;
  uint32 gid = 9;
  uint32 mode = 10;
  uint64 length = 11;
  bytes sha256 = 12;
  string service_name = 13;
}

message MaterializationTransferChunk {
  uint32 sequence = 1; // one-based within this task step
  bytes content = 2;
}

message MaterializationTransferEnd {
  uint32 chunk_count = 1;
}

// ManagedConfigTransfer carries one bounded immutable artifact referenced by
// a generic ComponentApply step. It never carries a destination, executable,
// argv, shell text, host path, image, or URL; the compiled Agent catalog owns
// those choices.
message ManagedConfigTransfer {
  string task_id = 1;
  bytes plan_hash = 2;
  string step_id = 3;
  string assignment_id = 4;
  oneof record {
    ManagedConfigTransferHeader header = 5;
    ManagedConfigTransferChunk chunk = 6;
    ManagedConfigTransferEnd end = 7;
  }
}

message ManagedConfigTransferHeader {
  string artifact_id = 1;
  string media_type = 2;
  uint64 length = 3;
  bytes sha256 = 4;
}

message ManagedConfigTransferChunk {
  uint32 sequence = 1;
  bytes content = 2;
}

message ManagedConfigTransferEnd {
  uint32 chunk_count = 1;
}

message TaskAssignment {
  string task_id = 1;
  string operation_id = 2; // stable across retries
  string retry_of = 3;     // set iff this is a retry of a prior task_id
  ExecutionPlan plan = 4;  // complete authoritative procedure
  reserved 5;
  google.protobuf.Timestamp forward_deadline = 7; // durable absolute forward deadline; reconnect never restarts the budget
  string assignment_id = 6;
  ScriptAssignmentArtifacts script_artifacts = 8;
  repeated ScriptExecutionCheckpoint script_checkpoints = 9;
  bool automatic_reconcile = 10;
  BackupTaskAuthority backup_authority = 11;
  BackupTaskResume backup_resume = 12;
  bytes backup_authority_sha256 = 13;
  uint64 assignment_generation = 14;
  uint32 execution_epoch = 16; // positive shared fence for every emitted event and terminal acknowledgement
  TaskExecutionMode execution_mode = 17;
  google.protobuf.Timestamp recovery_deadline = 18; // fixed at first claim and never extended
  ReleaseRestorationAuthority restoration_authority = 19;
  bytes release_recovery_record_sha256 = 20; // required only in recovery_only mode
  ReleaseRecoveryDirective release_recovery_directive = 21; // required only in recovery_only mode
  google.protobuf.Timestamp execution_deadline = 22; // current bounded attempt deadline; proof-required recovery uses a distinct non-renewable budget
}

message ReleaseRecoveryDirective {
  repeated string step_ids = 1;
  uint32 cursor = 2;
  bytes release_recovery_record_sha256 = 3;
  ReleaseRecoveryPhase phase = 4;
  repeated string applicable_compensation_step_ids = 5;
}

enum ReleaseRecoveryPhase {
  RELEASE_RECOVERY_PHASE_UNSPECIFIED = 0;
  RELEASE_RECOVERY_PHASE_PROBE = 1;
  RELEASE_RECOVERY_PHASE_COMPENSATE = 2;
  RELEASE_RECOVERY_PHASE_PROVEN = 3;
}

enum TaskExecutionMode {
  TASK_EXECUTION_MODE_UNSPECIFIED = 0;
  TASK_EXECUTION_MODE_FORWARD = 1;
  TASK_EXECUTION_MODE_RECOVERY_ONLY = 2;
}

enum ReleaseRestorationTarget {
  RELEASE_RESTORATION_TARGET_UNSPECIFIED = 0;
  RELEASE_RESTORATION_TARGET_SERVING_PREDECESSOR = 1;
  RELEASE_RESTORATION_TARGET_CANDIDATE_ABSENCE = 2;
}

message ReleaseRestorationCandidate {
  string service_id = 1;
  string release_id = 2;
  ReleaseRestorationTarget target = 3;
}

message ReleaseAppliedPredecessorAuthority {
  int64 key_revision = 1;
  string revision_id = 2;
  uint64 render_generation = 3;
  bytes compose_artifact_sha256 = 4;
  bytes compose_artifact = 5;
}

message ReleaseRestorationAuthority {
  reserved 1;
  string task_id = 2;
  string operation_id = 3;
  bytes plan_hash = 4;
  string environment_id = 5;
  string candidate_artifact_id = 6;
  repeated ReleaseRestorationCandidate candidates = 7;
  ReleaseAppliedPredecessorAuthority applied_predecessor = 8;
  bytes authority_sha256 = 9;
  repeated ReleaseNativePredecessorAuthority native_predecessors = 10;
}

message ReleaseNativePredecessorAuthority {
  string service_id = 1;
  bytes current_artifact = 2;
  bytes retained_prior_artifact = 3;
}

enum ScriptExecutionState {
  SCRIPT_EXECUTION_STATE_UNSPECIFIED = 0;
  SCRIPT_EXECUTION_STATE_NOT_STARTED = 1;
  SCRIPT_EXECUTION_STATE_START_AUTHORIZED = 2;
  SCRIPT_EXECUTION_STATE_BODY_PREPARED = 3;
  SCRIPT_EXECUTION_STATE_CONTAINER_CREATED = 4;
  SCRIPT_EXECUTION_STATE_OUTCOME_RECORDED = 5;
  SCRIPT_EXECUTION_STATE_CLEANUP_PROVEN = 6;
}

enum ScriptOutcomeReason {
  SCRIPT_OUTCOME_REASON_UNSPECIFIED = 0;
  SCRIPT_OUTCOME_REASON_NORMAL_EXIT = 1;
  SCRIPT_OUTCOME_REASON_START_FAILURE = 2;
  SCRIPT_OUTCOME_REASON_RUNTIME_FAILURE = 3;
  SCRIPT_OUTCOME_REASON_TIMEOUT = 4;
  SCRIPT_OUTCOME_REASON_ABORT = 5;
  SCRIPT_OUTCOME_REASON_ABORT_BEFORE_START = 6;
  SCRIPT_OUTCOME_REASON_EXPIRY_BEFORE_START = 7;
  SCRIPT_OUTCOME_REASON_NO_SERVING_RELEASE = 8;
  SCRIPT_OUTCOME_REASON_RECOVERY_INVARIANT_FAILURE = 9;
}

message ScriptStartAuthorizedCheckpoint {}

message ScriptBodyPreparedCheckpoint {
  bytes body_sha256 = 1;
  uint32 uid = 2;
  uint32 gid = 3;
  uint64 device = 4;
  uint64 inode = 5;
  string leaf = 6;
}

message ScriptContainerCreatedCheckpoint {
  string container_id = 1;
  bytes ownership_labels_sha256 = 2;
}

message ScriptOutcomeCheckpoint {
  ScriptOutcomeReason reason = 1;
  optional int32 exit_code = 2;
  bool output_truncated = 3;
  google.protobuf.Timestamp observed_at = 4;
}

message ScriptCleanupCheckpoint {
  string container_id = 1;
  uint64 body_device = 2;
  uint64 body_inode = 3;
  string body_leaf = 4;
  bool container_absent = 5;
  bool body_absent = 6;
  bool execution_directory_absent = 7;
}

message ScriptExecutionCheckpoint {
  ScriptExecutionState state = 1;
  bool start_authorized = 2;
  ScriptBodyPreparedCheckpoint body_prepared = 3;
  ScriptContainerCreatedCheckpoint container_created = 4;
  ScriptOutcomeCheckpoint outcome = 5;
  ScriptCleanupCheckpoint cleanup = 6;
  bool reconciliation_required = 7;
  string script_execution_id = 8;
}

message ScriptCheckpointRequest {
  string task_id = 1;
  string operation_id = 2;
  string assignment_id = 3;
  string step_id = 4;
  string script_execution_id = 5;
  bytes plan_hash = 6;
  ScriptExecutionState expected_state = 7;
  ScriptExecutionState state = 8;
  bytes control_payload_sha256 = 9;
  oneof evidence {
    ScriptStartAuthorizedCheckpoint start_authorized = 10;
    ScriptBodyPreparedCheckpoint body_prepared = 11;
    ScriptContainerCreatedCheckpoint container_created = 12;
    ScriptOutcomeCheckpoint outcome = 13;
    ScriptCleanupCheckpoint cleanup = 14;
  }
}

message ScriptCheckpointAck {
  string task_id = 1;
  string operation_id = 2;
  string assignment_id = 3;
  string step_id = 4;
  string script_execution_id = 5;
  ScriptExecutionState state = 6;
  bytes control_payload_sha256 = 7;
}

enum BackingHookEvent {
  BACKING_HOOK_EVENT_UNSPECIFIED = 0;
  BACKING_HOOK_EVENT_ATTACH = 1;
  BACKING_HOOK_EVENT_DETACH = 2;
  BACKING_HOOK_EVENT_BEFORE_STOP = 3;
  BACKING_HOOK_EVENT_AFTER_START = 4;
}

enum BackingHookCheckpointState {
  BACKING_HOOK_CHECKPOINT_STATE_UNSPECIFIED = 0;
  BACKING_HOOK_CHECKPOINT_STATE_STARTED = 1;
  BACKING_HOOK_CHECKPOINT_STATE_RESULT = 2;
}

message BackingHookValue {
  string key = 1;
  bytes value = 2;
}

message BackingHookFactDefinition {
  string key = 1;
  bool secret = 2;
}

// BackingHookProcedure is a frozen, task-private execution instruction. Values
// are transient on the authenticated Agent channel and are never persisted in
// the Task plan record.
message BackingHookProcedure {
  BackingHookEvent event = 1;
  repeated string command = 2;
  uint32 timeout_seconds = 3;
  string backing_service_id = 4;
  string attach_id = 5;
  string tenant_id = 6;
  string project_id = 7;
  string environment_id = 8;
  string service_id = 9;
  repeated BackingHookValue inputs = 10;
  repeated BackingHookValue facts = 11;
  repeated BackingHookFactDefinition fact_schema = 12;
}

// STARTED authorizes the irreversible hook execution. RESULT conveys the
// complete validated result for Controller-side encryption and publication.
message BackingHookCheckpointRequest {
  string task_id = 1;
  string operation_id = 2;
  string assignment_id = 3;
  uint32 execution_epoch = 4;
  string step_id = 5;
  bytes plan_hash = 6;
  BackingHookEvent event = 7;
  BackingHookCheckpointState state = 8;
  bytes result_sha256 = 9;
  repeated BackingHookValue facts = 10;
}

message BackingHookCheckpointAck {
  string task_id = 1;
  string operation_id = 2;
  string assignment_id = 3;
  uint32 execution_epoch = 4;
  string step_id = 5;
  bytes plan_hash = 6;
  BackingHookEvent event = 7;
  BackingHookCheckpointState state = 8;
  bytes result_sha256 = 9;
  bool existing = 10;
}

message ExecutionPlan {
  uint32 schema = 1; // exactly 1
  string plan_id = 2;
  bytes plan_hash = 3; // SHA-256 of deterministic serialization with this field cleared
  uint64 render_generation = 4;
  PlanOperation operation = 5;
  string target_id = 6;
  repeated ComposeArtifact artifacts = 7;
  repeated ExecutionStep steps = 8;
  repeated ResolvedRunnerSnapshot script_runner_snapshots = 9;
  repeated ScriptRunnerProjection script_runner_projections = 10;
  repeated ScriptBodyArtifactMetadata script_body_artifacts = 11;
  ComponentLifecycleMode component_lifecycle_mode = 12;
  ComponentApply component_rollback_observation = 13;
  CandidateReleaseProcedure candidate_release_procedure = 14;
  ManagedComponentProcedure managed_component_procedure = 15;
  ServiceLifecycleProcedure service_lifecycle_procedure = 16;
  EntryMutationProcedure entry_mutation_procedure = 17;
  BackupPlanScope backup_scope = 18;
}

// EntryMutationProcedure confines configuration reconciliation to retained
// workloads. The baseline proves runtime identity; the candidate supplies only
// Entry decorations and pinned materializations. Stable proxies are untouched.
message EntryMutationProcedure {
  string baseline_artifact_id = 1;
  string candidate_artifact_id = 2;
}

// ServiceLifecycleProcedure narrowly authorizes lifecycle steps to act on
// exact historical runtime artifacts. It grants no project-wide selection.
message ServiceLifecycleProcedure {
  repeated ServiceLifecycleSource sources = 1;
}

message ServiceLifecycleSource {
  string artifact_id = 1;
  string source_plan_id = 2;
  uint64 source_render_generation = 3;
  string service_id = 4;
  repeated string compose_names = 5;
  string step_id = 6;
}

// ManagedComponentProcedure is the exact immutable authority for removing
// possible prior Environment Component runtime before starting the current
// managed Services. It never grants project-wide or resource removal.
message ManagedComponentProcedure {
  repeated ManagedComponentService services = 1;
}

message ManagedComponentService {
  string component_kind = 1;
  string component_id = 2;
  string service_id = 3;
  string compose_service_name = 4;
  string source_revision_id = 5;
  string source_artifact_id = 6;
  bytes source_artifact_sha256 = 7;
  string remove_step_id = 8;
}

// CandidateReleaseProcedure is the single immutable restoration authority for
// every candidate Service mutation in an execution plan.
message CandidateReleaseProcedure {
  repeated CandidateReleaseMember members = 1;
  ConfigurationRestoration configuration_restoration = 2;
}

// ConfigurationRestoration binds only destinations written by this Task.
// Empty prior snapshot identity records initial acknowledged absence, not
// permission to inspect desired state or discover restoration targets on-host.
message ConfigurationRestoration {
  string prior_snapshot_id = 1;
  bytes prior_snapshot_sha256 = 2;
  repeated ConfigurationFileRestoration files = 3;
}

message ConfigurationFileRestoration {
  string forward_step_id = 1;
  string probe_step_id = 2;
  string compensate_step_id = 3;
}

message CandidateReleaseMember {
  string service_id = 1;
  string candidate_release_id = 2;
  string candidate_artifact_id = 3;
  repeated string forward_step_ids = 4;
  ServingPredecessorRestoration serving_predecessor = 5;
  CandidateAbsenceRestoration candidate_absence = 6;
}

message ServingPredecessorRestoration {
  string probe_step_id = 1;
  string compensate_step_id = 2;
  string prior_artifact_id = 3;
  string prior_release_id = 4;
  string prior_target = 5;
  string retained_prior_artifact_id = 6;
}

message CandidateAbsenceRestoration {
  string compose_project_name = 1;
  repeated CandidateReleaseService services = 2;
  string probe_step_id = 3;
  string compensate_step_id = 4;
}

message CandidateReleaseService {
  string service_id = 1;
  string release_id = 2;
}

message CandidateRestorationProbe {
  string candidate_artifact_id = 1;
  string service_id = 2;
  string candidate_release_id = 3;
}

message CandidateRestorationCompensate {
  string candidate_artifact_id = 1;
  string service_id = 2;
  string candidate_release_id = 3;
}

enum ComponentLifecycleMode {
  COMPONENT_LIFECYCLE_MODE_UNSPECIFIED = 0;
  COMPONENT_LIFECYCLE_MODE_UPDATE = 1;
  COMPONENT_LIFECYCLE_MODE_ENABLE = 2;
