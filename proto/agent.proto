message BackupPruneObjectDeleted {
  uint32 ordinal = 1;
  string point_id = 2;
  BackupObjectIdentity object = 3;
}

// Startup inventory contains at most 32 total stage and private Volume
// Restore rows, each group in recovery-key order. Stages carry one or two
// unique role-ordered files. Recovery repeats exact evidence; silence never
// grants discard permission.
message BackupStagingInventory {
  repeated BackupRecoveredStage entries = 1;
  repeated BackupRecoveredVolumeRestore volume_restores = 2;
}

// The two private Volume metadata journals are inventoried as one exact
// Restore generation. Neither a path nor an unbounded manifest is sent.
message BackupRecoveredVolumeRestore {
  bytes recovery_key_sha256 = 1;
  string assignment_id = 2;
  string restore_generation_id = 3;
  bytes step_sha256 = 4;
  bool journal_present = 5;
  bytes old_manifest_sha256 = 6;
  bytes old_full_tree_sha256 = 7;
  bytes new_manifest_sha256 = 8;
  bytes new_full_tree_sha256 = 9;
  uint64 old_entry_count = 10;
  uint64 new_entry_count = 11;
  uint64 journal_record_count = 12;
  bytes journal_chain_sha256 = 13;
  bool journal_pending = 14;
  bool journal_root_deleted = 15;
  bool receiver_present = 16;
  uint64 receiver_committed_record_sequence = 17;
  bool receiver_complete = 18;
  bool receiver_partial = 19;
  bool journal_partial = 20;
  bool journal_retiring = 21;
  bool receiver_retiring = 22;
  bytes receiver_content_manifest_sha256 = 23;
  bytes receiver_full_tree_sha256 = 24;
  bytes receiver_source_sha256 = 25;
  uint64 receiver_entry_count = 26;
  bool journal_discarding = 27;
  bool receiver_discarding = 28;
}

message BackupRecoveredStage {
  bytes recovery_key_sha256 = 1;
  repeated BackupRecoveredFile files = 2;
  // Durable execution marker survives source-file cleanup until helper state
  // is classified under a Controller disposition. It may have no files.
  bool postgres_execution = 3;
}

enum BackupRecoveredFileRole {
  BACKUP_RECOVERED_FILE_ROLE_UNSPECIFIED = 0;
  BACKUP_RECOVERED_FILE_ROLE_SOURCE_PLAINTEXT = 1;
  BACKUP_RECOVERED_FILE_ROLE_STORED_OBJECT = 2;
}

message BackupRecoveredFile {
  BackupRecoveredFileRole role = 1;
  uint64 size_bytes = 2;
  bytes sha256 = 3;
}

message BackupStagingRecoveryPlan {
  bytes inventory_sha256 = 1;
  repeated BackupStagingDisposition dispositions = 2;
  repeated BackupVolumeRestoreRecoveryDisposition volume_dispositions = 3;
  // Reclassification after native authority changes while delivery is pending.
  // The exact predecessor plan remains identified; inventory cannot change.
  bytes supersedes_plan_sha256 = 4;
}

message BackupVolumeRestoreRecoveryDisposition {
  bytes recovery_key_sha256 = 1;
  oneof disposition {
    BackupVolumeRestoreResume resume = 2;
    BackupVolumeRestoreHold hold = 3;
    BackupVolumeRestoreCleanup cleanup = 4;
  }
}

message BackupVolumeRestoreResume {
  bytes assignment_resume_sha256 = 1;
  int64 native_restore_mod_revision = 2;
  bytes native_restore_sha256 = 3;
}

message BackupVolumeRestoreHold {
  int64 native_restore_mod_revision = 1;
  bytes native_restore_sha256 = 2;
}

message BackupVolumeRestoreCleanup {
  int64 native_restore_mod_revision = 1;
  bytes native_restore_sha256 = 2;
}

message BackupStagingDisposition {
  bytes recovery_key_sha256 = 1;
  oneof disposition {
    BackupResumePrepared resume_prepared = 2;
    BackupDiscardRecovered discard_recovered = 3;
    BackupRecoveryRequired recovery_required = 4;
  }
  BackupPostgresStagingGuard postgres_guard = 5;
}

// Exact retained release and runtime selection, never current desired state.
// Inspection grants no client execution or file cleanup authority by itself.
message BackupPostgresStagingGuard {
  string task_id = 1;
  BackupStepAuthority step = 2;
  BackupServiceFact database_service = 3;
  ComposeArtifact database_artifact = 4;
  // Present only for the exact terminal native RecoveryRequired apply attempt.
  BackupPostgresRestoreApplyStartCheckpoint recovery_apply = 5;
  // Only a terminal safe/completed Task permits namespace retirement and
  // removal of its execution marker. Live resume and recovery holds do not.
  bool terminal_cleanup = 6;
  // Native completion already proves helper retirement. Only forget this
  // Task's marker; the database may now belong to a different operation.
  bool completed_task = 7;
}

enum BackupRemainingGrowth {
  BACKUP_REMAINING_GROWTH_UNSPECIFIED = 0;
  BACKUP_REMAINING_GROWTH_NO_GROWTH = 1;
  BACKUP_REMAINING_GROWTH_BOUNDED = 2;
  BACKUP_REMAINING_GROWTH_EXCLUSIVE_UNKNOWN = 3;
}

message BackupResumePrepared {
  bytes assignment_resume_sha256 = 1;
  BackupRemainingGrowth remaining_growth = 2;
  uint64 required_growth_bytes = 3; // positive only for bounded growth
  repeated BackupRecoveredFile expected_files = 4;
  // Config capture only, before ArtifactPrepared selected ciphertext. Preserve
  // the independently verified complete source; retire only derived ciphertext.
  BackupRestartConfigEncryption restart_config_encryption = 5;
  // PostgreSQL capture only, before ArtifactPrepared. Preserve the inventoried
  // source for original-Exec verification; retire only unselected ciphertext.
  BackupRestartPostgresEncryption restart_postgres_encryption = 6;
}

message BackupRestartConfigEncryption {}
message BackupRestartPostgresEncryption {}

message BackupDiscardRecovered {}

// Classified unresolved mutation: preserve the exact files without granting
// execution, cleanup or growth authority. Other owned work may become Ready.
message BackupRecoveryRequired {
  int64 native_restore_mod_revision = 1;
  bytes native_restore_sha256 = 2;
  repeated BackupRecoveredFile expected_files = 3;
}

message BackupStagingRecoveryAck {
  bytes inventory_sha256 = 1;
  bytes applied_plan_sha256 = 2;
  uint32 applied_disposition_count = 3;
}

enum BackupConfigDirection {
  BACKUP_CONFIG_DIRECTION_UNSPECIFIED = 0;
  BACKUP_CONFIG_DIRECTION_CAPTURE = 1;
  BACKUP_CONFIG_DIRECTION_RESTORE = 2;
}

message BackupConfigTransfer {
