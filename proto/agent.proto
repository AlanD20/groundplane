  PLAN_OPERATION_REMOVE = 7;
  PLAN_OPERATION_COMPONENT_APPLY = 8;
  PLAN_OPERATION_ENVIRONMENT_CREATE = 9;
  PLAN_OPERATION_ATTACH = 10;
  PLAN_OPERATION_DETACH = 11;
  PLAN_OPERATION_BACKUP = 12;
  PLAN_OPERATION_BACKUP_PRUNE = 13;
