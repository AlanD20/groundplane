// ComponentApply is the generic catalog action reference accepted by the Agent.
// Artifact content travels through the separately validated execution bundle.
// Read-only DNS diagnostics against the captured acknowledged resolver. The
// compiled observation action supplies paths, image and listener configuration;
// the caller cannot supply executable commands or arbitrary upstream endpoints.
message CheckDNSConnections {
  string request_id = 1;
  ComponentApply action = 2;
  ComposeArtifact runtime = 3;
  DNSResolverObservationEvidence prior_observation = 4;
  repeated DNSConnectionQuery queries = 5;
}

message DNSConnectionQuery {
  string domain = 1;
  string name = 2;
  DNSQueryType type = 3;
}

message CancelDNSConnections {
  string request_id = 1;
}

message DNSConnectionAnswer {
  string domain = 1;
  string name = 2;
  string server = 3;
  DNSQueryType type = 4;
  bool through_resolver = 5;
  string outcome = 6; // closed connection outcome; no provider text
  optional uint32 rcode = 7;
  bool used_tcp = 8;
  repeated DNSAnswerRecord answers = 9; // bounded sample, not a packet dump
  uint32 total_answers = 10;
  uint32 elapsed_milliseconds = 11;
}

message DNSConnectionResult {
  string request_id = 1;
  string component_id = 2;
  string artifact_id = 3;
  uint64 render_generation = 4;
  google.protobuf.Timestamp observed_at = 5;
  repeated DNSConnectionAnswer answers = 6;
  string failure = 7; // empty, runtime_unavailable, configuration_changed,
                     // query_selection_invalid, or execution_failed
}

// Closed read-only connector/Route check. Runtime and action are captured
// acknowledged authority. Private JSON uses the bounded edge-check helper
// contract, not arbitrary command input or a provider credential.
message CheckEdgeConnections {
  string request_id = 1;
  string task_id = 2; // immutable original helper Task, also for cleanup Retry
  string connector_container_id = 3;
  string helper_image = 4;
  bytes parameters_json = 5;
  ComponentApply action = 6;
  ComposeArtifact runtime = 7;
  bool cleanup_only = 8;
}

message CancelEdgeConnections {
  string request_id = 1;
}

message EdgeConnectionResult {
  string request_id = 1;
  string task_id = 2;
  string connector_container_id = 3;
  string helper_name = 4;
  bool cleanup_required = 5;
  bytes private_result_json = 6;
  string failure = 7;
  bool cleanup_only = 8;
}

message ComponentApply {
  string component_id = 1;
  bytes definition_digest = 2;
  bytes catalog_digest = 3;
  string action_id = 4;
  string artifact_id = 5;
  bytes artifact_digest = 6;
  uint64 generation = 7;
  bool managed_config_content = 8;
  bytes expected_previous_artifact_digest = 9;
  string expected_previous_artifact_id = 10;
  uint64 expected_previous_generation = 11;
  ContainerConfigTransition container_config_transition = 12;
}

// Non-secret immutable provider bytes captured before this Task's file change.
// An explicitly empty source denotes a new router; a missing message does not.
// Host managed-config lifecycle fields remain separate authority.
message ContainerConfigTransition {
  bytes previous_source = 1;
  bytes previous_source_sha256 = 2;
  bytes desired_source = 3;
}

// Host resolution mutations are closed Agent procedures. Paths and file
// content are fixed by the Agent binary and never supplied by a Task.
message HostResolutionApply {
  string component_id = 1;
  uint64 generation = 2;
}

message HostResolutionRestore {
  string component_id = 1;
  uint64 generation = 2;
}

// ManagedConfigHelperRequest is accepted only by the static
// managed-config-helper Agent-binary mode. relative_path originates in the
// compiled Component catalog; it is never copied from a Task or operator API.
message ManagedConfigHelperRequest {
  uint32 schema = 1; // exactly 1
  string artifact_id = 2;
  string relative_path = 3;
  bytes content = 4;
  bytes sha256 = 5;
  ManagedConfigOperation operation = 6;
  string transaction_id = 7;
  bytes expected_previous_sha256 = 8; // empty means the live target must be absent
  uint64 generation = 9;
  string retry_of_transaction_id = 10; // exact preceding attempt of the same captured operation
}

enum ManagedConfigOperation {
  MANAGED_CONFIG_OPERATION_UNSPECIFIED = 0;
  MANAGED_CONFIG_OPERATION_PUBLISH = 1;
  MANAGED_CONFIG_OPERATION_COMMIT = 2;
  MANAGED_CONFIG_OPERATION_ROLLBACK = 3;
}

enum ManagedConfigReplayDisposition {
  MANAGED_CONFIG_REPLAY_DISPOSITION_UNSPECIFIED = 0;
  MANAGED_CONFIG_REPLAY_DISPOSITION_APPLIED = 1;
  MANAGED_CONFIG_REPLAY_DISPOSITION_EXACT_REPLAY = 2;
  MANAGED_CONFIG_REPLAY_DISPOSITION_RECOVERED = 3;
}

message ManagedConfigHelperResponse {
  uint32 schema = 1;
  string transaction_id = 2;
  ManagedConfigOperation operation = 3;
  ManagedConfigReplayDisposition disposition = 4;
  bytes live_sha256 = 5;
  bytes previous_sha256 = 6;
  uint64 live_device = 7;
  uint64 live_inode = 8;
}

enum BackupConsumerOperation {
  BACKUP_CONSUMER_OPERATION_UNSPECIFIED = 0;
  BACKUP_CONSUMER_OPERATION_STOP = 1;
  BACKUP_CONSUMER_OPERATION_RECOVER = 2;
}



message ComposeHelperResponse {
  uint32 schema = 1; // exactly 1
  ComposeHelperOutcome outcome = 2;
  int32 exit_code = 3;
  ComposeHelperDiagnostic diagnostic = 4;
  ServiceProxyEvidence proxy_evidence = 5;
  ServiceRecreateEvidence recreate_evidence = 6;
  CandidateAbsenceEvidence candidate_absence_evidence = 7;
  RollingProxyEvidence rolling_proxy_evidence = 8;
  RollingReleaseEvidence rolling_evidence = 9;
  reserved 10;
}

message RollingProxyEvidence {
  string service_id = 1;
  uint32 change_ordinal = 2;
  uint64 proxy_generation = 3;
  bytes config_sha256 = 4;
}

enum ComposeHelperOutcome {
  COMPOSE_HELPER_OUTCOME_UNSPECIFIED = 0;
  COMPOSE_HELPER_OUTCOME_COMPLETED = 1;
  COMPOSE_HELPER_OUTCOME_FAILED = 2;
  // Read-only serving CandidateRestorationProbe only. No restoration proof;
  // compensation still requires its predeclared durable obligation.
  COMPOSE_HELPER_OUTCOME_RESTORATION_REQUIRED = 3;
}

enum ComposeHelperDiagnostic {
  COMPOSE_HELPER_DIAGNOSTIC_UNSPECIFIED = 0;
  COMPOSE_HELPER_DIAGNOSTIC_NONE = 1;
  COMPOSE_HELPER_DIAGNOSTIC_CONFIG_REJECTED = 2;
  COMPOSE_HELPER_DIAGNOSTIC_COMPOSE_FAILED = 3;
  COMPOSE_HELPER_DIAGNOSTIC_COMPONENT_CONFIG_REJECTED = 4;
  COMPOSE_HELPER_DIAGNOSTIC_COMPONENT_ACTIVATION_FAILED = 5;
  COMPOSE_HELPER_DIAGNOSTIC_HEALTHCHECK_PGREP_MISSING = 6;
  COMPOSE_HELPER_DIAGNOSTIC_HEALTHCHECK_CURL_MISSING = 7;
  COMPOSE_HELPER_DIAGNOSTIC_HEALTHCHECK_NC_MISSING = 8;
  COMPOSE_HELPER_DIAGNOSTIC_HEALTHCHECK_COMMAND_MISSING = 9;
  COMPOSE_HELPER_DIAGNOSTIC_HEALTHCHECK_COMMAND_NOT_EXECUTABLE = 10;
}

message ConfigUpdate {
  AgentConfig agent_config = 1;
}

message Shutdown {}

// A captured consumer access check owned by a native Controller Task. This is
// not arbitrary network execution: only the fixed PostgreSQL/MySQL/Valkey
// procedures are admitted. Password bytes are transient channel/private stdin.
message CheckBackingAccess {
  string request_id = 1;
  string task_id = 2;
  string helper_image = 3;
  string consumer_container_id = 4;
  ServiceObservationTarget consumer_runtime = 5;
  BackingAccessParameters parameters = 6;
  bool cleanup_only = 7;
}

message BackingAccessParameters {
  string attach_id = 1;
  string credential_attach_id = 2;
  string environment_id = 3;
  string service_id = 4;
  string backing_service_id = 5;
  string family = 6;
  string authentication = 7;
  string host = 8;
  uint32 port = 9;
  string database = 10;
  string username = 11;
  bytes password = 12;
}

message CancelBackingAccess {
  string request_id = 1;
}

message BackingAccessResult {
  string request_id = 1;
  string task_id = 2;
  string helper_name = 3;
  bool cleanup_required = 4;
  BackingAccessObservation observation = 5;
  string failure = 6; // closed safe reason; never provider/credential text
}

message BackingAccessObservation {
  google.protobuf.Timestamp started_at = 1;
  google.protobuf.Timestamp finished_at = 2;
  repeated BackingAccessStage stages = 3;
}

message BackingAccessStage {
  string name = 1;
  string outcome = 2;
  string failure = 3;
  int64 elapsed_nanoseconds = 4;
}
