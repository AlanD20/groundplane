  reserved 10, 18, 26;
  reserved "service_mod_revision", "network_topology_revision", "applied_environment_mod_revision";

  string snapshot_id = 1;
  string script_execution_id = 2;
  string tenant_id = 3;
  uint64 tenant_mod_revision = 4;
  string project_id = 5;
  uint64 project_mod_revision = 6;
  string environment_id = 7;
  uint64 environment_mod_revision = 8;
  string service_id = 9;
  bytes service_definition_sha256 = 11;
  string release_id = 12;
  uint64 release_mod_revision = 13;
  string local_image_id = 14;
  string blueprint_bundle_generation = 16;
  uint64 render_generation = 17;
  repeated ScriptRunnerNetwork networks = 19;
  repeated ScriptRunnerMount mounts = 20;
  repeated ScriptRunnerEntryBinding entry_bindings = 21;
  repeated ScriptRunnerSecretValue secret_values = 22;
  bytes runner_projection_sha256 = 23;
