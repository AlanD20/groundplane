}

message ComposeStop {
  string artifact_id = 1;
  repeated string service_ids = 2;
  uint32 grace_seconds = 3;
}

message ComposeRemove {
  string artifact_id = 1;
  repeated string service_ids = 2;
  bool whole_project = 3;
}

message WaitHealthy {
  string artifact_id = 1;
  repeated string service_ids = 2;
}

message ComposeWorkloadApply {
  string artifact_id = 1;
  string service_id = 2;
  string target = 3;
  bool ensure_proxy = 4;
}

message WaitWorkloadHealthy {
  string artifact_id = 1;
  string service_id = 2;
  string target = 3;
}

message ServiceProxySwitch {
  string candidate_artifact_id = 1;
  string service_id = 2;
  string from_target = 3;
  string to_target = 4;
  uint64 proxy_generation = 5;
  bytes config_json = 6;
  bytes config_sha256 = 7;
  string release_id = 8;
  string prior_artifact_id = 9;
}

message ServiceProxyProbe {
  string candidate_artifact_id = 1;
  string service_id = 2;
  string expected_target = 3;
  uint64 proxy_generation = 4;
  bytes config_json = 5;
  bytes config_sha256 = 6;
  string release_id = 7;
  string alternate_target = 8;
  uint64 alternate_proxy_generation = 9;
  bytes alternate_config_json = 10;
  bytes alternate_config_sha256 = 11;
  string alternate_release_id = 12;
  string prior_artifact_id = 13;
}

message ServiceProxyCompensate {
  string candidate_artifact_id = 1;
  string service_id = 2;
  string candidate_target = 3;
  string prior_target = 4;
  uint64 proxy_generation = 5;
  bytes config_json = 6;
  bytes config_sha256 = 7;
  string prior_release_id = 8;
  bool enabled = 9;
  string prior_artifact_id = 10;
}

message ServiceProxyEvidence {
  string service_id = 1;
  string target = 2;
  uint64 proxy_generation = 3;
  bytes config_sha256 = 4;
  string release_id = 5;
  bool compensated = 6;
}

message ServiceRecreateAcknowledge {
  string artifact_id = 1;
  string service_id = 2;
  string release_id = 3;
}

message ServiceRecreateProbe {
  string candidate_artifact_id = 1;
  string prior_artifact_id = 2;
  string service_id = 3;
  string candidate_release_id = 4;
  string prior_release_id = 5;
}

message ServiceRecreateCompensate {
  string artifact_id = 1;
  string service_id = 2;
  string candidate_release_id = 3;
  string prior_release_id = 4;
  bool enabled = 5;
  string candidate_artifact_id = 6;
  string prior_target = 7;
}

message ServiceRecreateEvidence {
  string service_id = 1;
  string release_id = 2;
  string artifact_id = 3;
  bool compensated = 4;
  string target = 5;
}

message EnvironmentDirectoryCreate {
  string environment_id = 1;
  string expected_volume_dir = 2;
}

// EnvironmentDirectoryRemove names the same Controller-authorized directory
// identity as creation. The helper validates it beneath its configured root
// and never follows a symlink while removing it.
message EnvironmentDirectoryRemove {
  string environment_id = 1;
  string expected_volume_dir = 2;
}

// ManagedVolumeDirectoriesEnsure selects the managed volume table from one
// authenticated Environment Compose artifact. It never carries a host path.
message ManagedVolumeDirectoriesEnsure {
  string artifact_id = 1;
  repeated string volume_ids = 2;
  bytes intent_sha256 = 3;
}

// ManagedVolumeRemove removes exactly one Controller-owned Docker Volume
// after the candidate Compose artifact has detached every consumer.
message ManagedVolumeRemove {
  string volume_id = 1;
  string docker_name = 2;
}

// ManagedVolumeDirectoryRemove selects one immutable key beneath an artifact's
// authorized Environment volume directory. Traversal state is delivered by
// the task-owned removal protocol, never accepted as an operator path.
message ManagedVolumeDirectoryRemove {
  string artifact_id = 1;
  string volume_id = 2;
  string compose_key = 3;
  bytes intent_sha256 = 4;
  reserved 5; // traversal belongs to the durable per-call protocol, not the plan
}

// Private removal boundaries on the authenticated Agent stream. Binary values
// use the single volumeremovalrecord encoding; they are not operator inputs.
message VolumeRemovalCheckpointRequest {
  string request_id = 1;
  string task_id = 2;
  string operation_id = 3;
  string assignment_id = 4;
  string step_id = 5;
  bytes plan_hash = 6;
  bool consumers_detached = 7; // request first/pending call after mount absence proof
  bytes completion = 8; // alternatively acknowledge the exact helper result
}

message VolumeRemovalCheckpointAck {
  string request_id = 1;
  string task_id = 2;
  string operation_id = 3;
  string assignment_id = 4;
  bytes pending_path = 5; // already durable before the helper may run
  bool directory_absent = 6; // exclusive with pending_path
}

// ManagedNetworkRemove is the closed Zone-removal procedure. The helper may
// remove only the id-derived Docker network after verifying Groundplane
// ownership labels for the declared Environment.
message ManagedNetworkRemove {
  string network_id = 1;
  string environment_id = 2;
  string docker_name = 3;
}

// ComponentApply is the generic catalog action reference accepted by the Agent.
// Artifact content travels through the separately validated execution bundle.
message ComponentApply {
  string component_id = 1;
  bytes definition_digest = 2;
  bytes catalog_digest = 3;
  string action_id = 4;
  string artifact_id = 5;
  bytes artifact_digest = 6;
  uint64 generation = 7;
  bool managed_config_content = 8;
  bytes expected_previous_artifact_digest = 9;
  string expected_previous_artifact_id = 10;
  uint64 expected_previous_generation = 11;
}

// Host resolution mutations are closed Agent procedures. Paths and file
// content are fixed by the Agent binary and never supplied by a Task.
message HostResolutionApply {
  string component_id = 1;
  uint64 generation = 2;
}

message HostResolutionRestore {
  string component_id = 1;
  uint64 generation = 2;
}

// ManagedConfigHelperRequest is accepted only by the static
// managed-config-helper Agent-binary mode. relative_path originates in the
// compiled Component catalog; it is never copied from a Task or operator API.
message ManagedConfigHelperRequest {
  uint32 schema = 1; // exactly 1
  string artifact_id = 2;
  string relative_path = 3;
  bytes content = 4;
  bytes sha256 = 5;
  ManagedConfigOperation operation = 6;
  string transaction_id = 7;
  bytes expected_previous_sha256 = 8; // empty means the live target must be absent
  uint64 generation = 9;
}

enum ManagedConfigOperation {
  MANAGED_CONFIG_OPERATION_UNSPECIFIED = 0;
  MANAGED_CONFIG_OPERATION_PUBLISH = 1;
  MANAGED_CONFIG_OPERATION_COMMIT = 2;
  MANAGED_CONFIG_OPERATION_ROLLBACK = 3;
}

enum ManagedConfigReplayDisposition {
  MANAGED_CONFIG_REPLAY_DISPOSITION_UNSPECIFIED = 0;
  MANAGED_CONFIG_REPLAY_DISPOSITION_APPLIED = 1;
  MANAGED_CONFIG_REPLAY_DISPOSITION_EXACT_REPLAY = 2;
  MANAGED_CONFIG_REPLAY_DISPOSITION_RECOVERED = 3;
}

message ManagedConfigHelperResponse {
  uint32 schema = 1;
  string transaction_id = 2;
  ManagedConfigOperation operation = 3;
  ManagedConfigReplayDisposition disposition = 4;
  bytes live_sha256 = 5;
  bytes previous_sha256 = 6;
  uint64 live_device = 7;
  uint64 live_inode = 8;
}

// EnvironmentDirectoryHelperRequest is the single length-framed stdin message
// accepted by the static environment-directory-helper Agent-binary mode.
message EnvironmentDirectoryHelperRequest {
  uint32 schema = 1; // exactly 1
  string task_id = 2;
  string operation_id = 3;
  ExecutionPlan plan = 4;
  string step_id = 5;
  uint32 timeout_seconds = 6; // remaining bounded execution time
  string assignment_id = 7;
  bytes volume_removal_pending_path = 8;
}

message EnvironmentDirectoryHelperResponse {
  uint32 schema = 1; // exactly 1
  int32 exit_code = 2;
  string failed_step_id = 3;
  bytes next_cursor = 4;
  uint32 mutation_count = 5;
  bool complete = 6;
  bytes response_sha256 = 7;
  bytes volume_removal_completion = 8;
}

// ComposeHelperRequest is the single length-framed stdin message accepted by
// the static compose-helper Agent-binary mode.
message ComposeHelperRequest {
  reserved 8;
  uint32 schema = 1; // exactly 1
  string task_id = 2;
  string operation_id = 3;
  ExecutionPlan plan = 4;
  string step_id = 5;
  uint32 timeout_seconds = 6; // remaining bounded execution time
  string assignment_id = 7;
  ReleaseRestorationAuthority restoration_authority = 9;
}

message ComposeHelperResponse {
  uint32 schema = 1; // exactly 1
  ComposeHelperOutcome outcome = 2;
  int32 exit_code = 3;
  ComposeHelperDiagnostic diagnostic = 4;
  ServiceProxyEvidence proxy_evidence = 5;
  ServiceRecreateEvidence recreate_evidence = 6;
  CandidateAbsenceEvidence candidate_absence_evidence = 7;
}

enum ComposeHelperOutcome {
  COMPOSE_HELPER_OUTCOME_UNSPECIFIED = 0;
  COMPOSE_HELPER_OUTCOME_COMPLETED = 1;
  COMPOSE_HELPER_OUTCOME_FAILED = 2;
  // Read-only serving CandidateRestorationProbe only. No restoration proof;
  // compensation still requires its predeclared durable obligation.
  COMPOSE_HELPER_OUTCOME_RESTORATION_REQUIRED = 3;
}

enum ComposeHelperDiagnostic {
  COMPOSE_HELPER_DIAGNOSTIC_UNSPECIFIED = 0;
  COMPOSE_HELPER_DIAGNOSTIC_NONE = 1;
  COMPOSE_HELPER_DIAGNOSTIC_CONFIG_REJECTED = 2;
  COMPOSE_HELPER_DIAGNOSTIC_COMPOSE_FAILED = 3;
  COMPOSE_HELPER_DIAGNOSTIC_COMPONENT_CONFIG_REJECTED = 4;
  COMPOSE_HELPER_DIAGNOSTIC_COMPONENT_ACTIVATION_FAILED = 5;
}

message TaskAbort {
  string task_id = 1;
  string reason = 2;
  string assignment_id = 3;
}

message ConfigUpdate {
  AgentConfig agent_config = 1;
}

message Shutdown {}
