  string assignment_id = 2;
  string step_id = 3;
  BackupSecretSlotPurpose purpose = 4;
  oneof record {
    BackupSecretSlotHeader header = 5;
    BackupSecretSlotChunk chunk = 6;
    BackupSecretSlotEnd end = 7;
  }
}

enum BackupSecretSlotPurpose {
  BACKUP_SECRET_SLOT_PURPOSE_UNSPECIFIED = 0;
  BACKUP_SECRET_SLOT_PURPOSE_S3_ACCESS_KEY = 1;
