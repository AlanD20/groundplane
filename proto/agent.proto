// The Controller <-> Agent machine contract. This .proto is the single
// source of truth — both sides compile against it, so a contract change
// is a build error, never a silent runtime mismatch. See mvp.md, "Agent
// channel (locked): gRPC + protobuf".
//
// One long-lived bidirectional stream per agent, INITIATED BY THE AGENT
// (dial-out, pull model): the Agent signals Ready and the Controller
// assigns work; nothing is ever pushed to an unconnected agent.
syntax = "proto3";

package groundplane.agent.v1;

option go_package = "github.com/AlanD20/groundplane/proto/agentpb";

import "google/protobuf/timestamp.proto";

// Native work identity is shared by typed operation delivery, checkpoint and
// start/finish messages. Reconnection resends this identity; it never allocates
// an attempt or extends its deadline. Agent identity is checked against the
// authenticated connection, not trusted merely because it appears in a message.
message WorkInputReference {
  string input_id = 1;
  bytes sha256 = 2;
}

// Sent once after initial configuration on the authenticated Agent stream.
// Process generation binds this registration to this Agent process, while
// host identity stays stable across process restarts.
message WorkExecutorRegistration {
  string host_id = 1;
  string agent_id = 2;
  uint64 executor_generation = 3;
  bytes process_generation = 4;
}

// Startup may replay only the exact captured terminal report, never Start,
// checkpoints, command/input delivery or effect authorization. Completion closes
// this replay phase before normal Ready/dispatch and replacement reconciliation.
message WorkJournalReplayRequest {
  bytes report = 1; // one closed AgentMessage terminal report; at most 36 KiB
  bool complete = 2;
  // Exactly one request form is present. Inventory only checks existing durable
  // ownership; it neither promotes a partial file nor grants another execution.
  WorkAttemptIdentity unreported_attempt = 3;
  string uncommitted_attempt_id = 4;
}

message WorkJournalReplayAck {
  bytes report_sha256 = 1;
  bytes acknowledgement = 2; // exact typed ControllerMessage result
  string failure_code = 3; // rejected report retains its local evidence
  string failure_detail = 4;
  bool complete = 5;
  string accounted_attempt_id = 6;
}

// A terminal result could not be settled. This response grants no execution and
// acknowledges no effect or outcome. The Agent retains its exact report for
// reconciliation; unrelated operations may continue on the same stream.
message WorkReportRejection {
  WorkAttemptIdentity attempt = 1;
  string kind = 2;
  bytes report_sha256 = 3;
  string failure_code = 4;
  string failure_detail = 5;
}

enum WorkDirection {
  WORK_DIRECTION_UNSPECIFIED = 0;
  WORK_DIRECTION_FORWARD = 1;
  WORK_DIRECTION_RECOVERY = 2;
}

message WorkAttemptIdentity {
  string task_id = 1;
  string work_item_id = 2;
  string attempt_id = 3;
  uint64 attempt_number = 4;
  string host_id = 5;
  string agent_id = 6;
  uint64 executor_generation = 7;
  WorkDirection direction = 8;
  WorkInputReference input = 9;
  google.protobuf.Timestamp assigned_at = 10;
  google.protobuf.Timestamp deadline = 11;
}

message WorkStartRequest {
  WorkAttemptIdentity attempt = 1;
}

// Cancellation is a hint for this exact forward attempt. It neither retires a
// reservation nor proves cleanup; the typed operation must still report proof.
message WorkCancel {
  WorkAttemptIdentity attempt = 1;
}

message WorkStartAck {
  WorkAttemptIdentity attempt = 1;
  google.protobuf.Timestamp started_at = 2;
  // A saved start receipt requires operation-specific reconciliation. It is
  // never permission to repeat the first effect after a reconnect/lost ack.
  bool reconcile = 3;
  // Highest durable operation/hook checkpoint at this Start read. A saved
  // Start without checkpoints cannot have granted a Release host effect.
  uint64 checkpoint_sequence = 4;
}

// Captured Environment cleanup under one hierarchy-removal work item. No child
// Task or generic step list is delivered. Start/checkpoints grant host effects.
message EnvironmentRemovalAssignment {
  WorkAttemptIdentity attempt = 1;
  EnvironmentRemovalInput removal = 2;
  bytes recovery = 3; // canonical captured forward failure; required only for Recovery
}

message EnvironmentRemovalInput {
  WorkInputReference captured_source = 1;
  string environment_id = 2;
  string expected_volume_dir = 3;
  ComposeArtifact compose = 4; // absent when no Compose runtime was captured
}

// One native Environment directory provisioning item. Delivery grants no
// filesystem access; the durable WorkStart receipt precedes the single effect.
message EnvironmentProvisionInput {
  string task_id = 1;
  string work_item_id = 2;
  string tenant_id = 3;
  string project_id = 4;
  string environment_id = 5;
  string environment_name = 6;
  string network_pool = 7;
  string host_id = 8;
  string volume_root = 9;
  string volume_directory = 10;
  google.protobuf.Timestamp created_at = 11;
}

// Backing facade creation is one captured procedure, not an ExecutionPlan.
// File bodies and hook values are delivered separately after the matching
// stage has a durable checkpoint acknowledgement.
message BackingProvisionInput {
  string task_id = 1;
  string work_item_id = 2;
  string operation_id = 3;
  string project_id = 4;
  string environment_id = 5;
  string service_id = 6;
  string host_id = 7;
  string volume_root = 8;
  string volume_directory = 9;
  uint64 render_generation = 10;
  ComposeArtifact runtime = 11;
  repeated string managed_volume_ids = 12;
  WorkConfigurationReference configuration = 13;
  repeated MaterializeFile files = 14;
  BackingProvisionAfterStart after_start = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp deadline = 17;
}

message BackingProvisionAfterStart {
  repeated string command = 1;
  uint32 timeout_seconds = 2;
  // Ciphertext digest and operation id, never the resolved input values.
  WorkInputReference encrypted_inputs = 3;
}

message BackingProvisionAssignment {
  WorkAttemptIdentity attempt = 1;
  BackingProvisionInput input = 2;
  bytes recovery_source = 3;
}

message BackingProvisionCheckpointRequest {
  WorkAttemptIdentity attempt = 1;
  bytes progress = 2;
}

message BackingProvisionCheckpointAck {
  WorkAttemptIdentity attempt = 1;
  bytes progress = 2;
  WorkInputReference evidence = 3;
}

message BackingProvisionCompletionRequest {
  WorkAttemptIdentity attempt = 1;
  WorkInputReference evidence = 2;
  bytes runtime_observation = 3;
}

message BackingProvisionCompletionAck {
  WorkAttemptIdentity attempt = 1;
  WorkInputReference evidence = 2;
  string outcome = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp finished_at = 5;
}

message BackingProvisionFailureRequest {
  WorkAttemptIdentity attempt = 1;
  string reason = 2;
}

message BackingProvisionFailureAck {
  WorkAttemptIdentity attempt = 1;
  bytes failure = 2;
  WorkInputReference evidence = 3;
  string outcome = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp finished_at = 6;
}

message BackingProvisionConfigurationRequest {
  WorkAttemptIdentity attempt = 1;
  string stage_id = 2;
}

message BackingProvisionConfigurationManifest {
  WorkAttemptIdentity attempt = 1;
  string stage_id = 2;
  WorkConfigurationReference configuration = 3;
  repeated MaterializeFile files = 4;
}

message BackingProvisionFileRequest {
  WorkAttemptIdentity attempt = 1;
  string stage_id = 2;
  string destination = 3;
}

message BackingProvisionFileDelivery {
  WorkAttemptIdentity attempt = 1;
  string stage_id = 2;
  WorkConfigurationReference configuration = 3;
  MaterializeFile file = 4;
  bytes content = 5;
}

message BackingProvisionHookRequest {
  WorkAttemptIdentity attempt = 1;
  string stage_id = 2;
}

message BackingProvisionHookDelivery {
  WorkAttemptIdentity attempt = 1;
  string stage_id = 2;
  BackingHookProcedure hook = 3;
}

message BackingProvisionRecoveryRequest {
  WorkAttemptIdentity attempt = 1;
  bytes report = 2;
}

message BackingProvisionRecoveryAck {
  WorkAttemptIdentity attempt = 1;
  WorkInputReference evidence = 2;
  string outcome = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp finished_at = 5;
}

message BackingProvisionHelperRequest {
  BackingProvisionAssignment assignment = 1;
  WorkStartAck start = 2;
  BackingProvisionCheckpointRequest report = 3;
  BackingProvisionCheckpointAck acknowledgement = 4;
  bool inspect_only = 5;
}

message BackingProvisionHelperResponse {
  bytes observation = 1;
  bytes runtime_observation = 2;
  bytes recovery_report = 3;
}

message EnvironmentProvisionAssignment {
  WorkAttemptIdentity attempt = 1;
  EnvironmentProvisionInput input = 2;
  // Cleanup inspects only the original failed execution; it never creates a
  // missing directory. The original failure remains the action outcome.
  EnvironmentProvisionRecoverySource recovery_source = 3;
}

message EnvironmentProvisionRecoverySource {
  WorkAttemptIdentity attempt = 1;
  google.protobuf.Timestamp started_at = 2;
  google.protobuf.Timestamp finished_at = 3;
  string outcome = 4;
  WorkInputReference evidence = 5;
}

message EnvironmentProvisionResultRequest {
  WorkAttemptIdentity attempt = 1;
  bool directory_ready = 2;
  bool helpers_absent = 3;
  string failure = 4;
  string cleanup_failure = 5;
  google.protobuf.Timestamp observed_at = 6;
}
message EnvironmentProvisionResultAck {
  WorkAttemptIdentity attempt = 1;
  WorkInputReference evidence = 2;
  string outcome = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp finished_at = 5;
}

message EnvironmentProvisionHelperRequest {
  EnvironmentProvisionAssignment assignment = 1;
  WorkStartAck start = 2;
  bool inspect_only = 3;
}
message EnvironmentProvisionHelperResponse {
  string environment_id = 1;
  WorkInputReference input = 2;
  bool directory_ready = 3;
  bool inspection = 4;
  google.protobuf.Timestamp observed_at = 5;
}

// Native Attach credential cleanup. Values are transient authenticated delivery;
// operation storage retains encrypted facts and captured source references.
message AttachRemovalAssignment {
  WorkAttemptIdentity attempt = 1;
  AttachRemovalInput removal = 2;
}

// Inspection only: no credential or hook input is delivered for recovery.
message AttachRecoveryAssignment {
  WorkAttemptIdentity attempt = 1;
  bytes recovery = 2;
  AttachConsumerTransition consumer = 3; // only for an interrupted consumer transition
}

message AttachRecoveryCompletionRequest {
  WorkAttemptIdentity attempt = 1;
  bytes report = 2;
  WorkInputReference evidence = 3;
}

message AttachRecoveryCompletionAck {
  WorkAttemptIdentity attempt = 1;
  WorkInputReference evidence = 2;
  string outcome = 3;
  google.protobuf.Timestamp finished_at = 4;
  google.protobuf.Timestamp started_at = 5;
}

// Transient provisioning input. The captured source owns credentials and hook
// values; Agents retain only non-secret command authority and checkpoints.
message AttachProvisionFactsRequest {
  WorkAttemptIdentity attempt = 1;
  repeated BackingHookValue facts = 2;
}

message AttachProvisionFactsAck {
  WorkAttemptIdentity attempt = 1;
  bytes result_sha256 = 2;
}

message AttachProvisionAssignment {
  WorkAttemptIdentity attempt = 1;
  AttachProvisionInput provision = 2;
}

message AttachProvisionRecoveryAssignment {
  WorkAttemptIdentity attempt = 1;
  bytes recovery = 2;
  AttachConsumerTransition consumer = 3;
}

message AttachProvisionRecoveryReportRequest {
  WorkAttemptIdentity attempt = 1;
  bytes report = 2;
  WorkInputReference evidence = 3;
}

message AttachProvisionRecoveryReportAck {
  WorkAttemptIdentity attempt = 1;
  WorkInputReference evidence = 2;
  string outcome = 3;
  google.protobuf.Timestamp finished_at = 4;
  google.protobuf.Timestamp started_at = 5;
}

message AttachProvisionCheckpointRequest {
  WorkAttemptIdentity attempt = 1;
  bytes report = 2;
}

message AttachProvisionCheckpointAck {
  WorkAttemptIdentity attempt = 1;
  bytes report = 2;
}

message AttachProvisionCompletionRequest {
  WorkAttemptIdentity attempt = 1;
  uint64 checkpoint_sequence = 2;
  WorkInputReference checkpoint_evidence = 3;
}

// Sent only after the Controller atomically retains the binding outcome and
// any encrypted hook facts with the terminal work result.
message AttachProvisionCompletionAck {
  WorkAttemptIdentity attempt = 1;
  uint64 checkpoint_sequence = 2;
  WorkInputReference checkpoint_evidence = 3;
  google.protobuf.Timestamp finished_at = 4;
  string outcome = 5;
  WorkInputReference binding_result = 6;
}

message AttachProvisionFailureRequest {
  WorkAttemptIdentity attempt = 1;
  string reason = 2;
}

message AttachProvisionFailureAck {
  WorkAttemptIdentity attempt = 1;
  WorkInputReference evidence = 2;
  bytes failure = 3;
  string outcome = 4;
  google.protobuf.Timestamp finished_at = 5;
  google.protobuf.Timestamp started_at = 6;
}

message AttachProvisionInput {
  WorkInputReference captured_source = 1;
  string attach_id = 2;
  string backing_service_id = 3;
  string tenant_id = 4;
  string project_id = 5;
  string environment_id = 6;
  string service_id = 7;
  AttachConsumerTransition consumer = 8;
  oneof provision {
    AttachCredentialProvision credential = 10;
    BackingHookProcedure custom_attach = 11;
  }
}

message AttachCredentialProvision {
  string adapter_key = 1;
  BackingAuthentication authentication = 2;
  string role = 3;
  bytes password = 4;
  string database = 5;
  repeated AttachGrantProvision grants = 6;
}

message AttachGrantProvision {
  string attach_id = 1;
  string database = 2;
}

message AttachRemovalInput {
  WorkInputReference captured_source = 1;
  string attach_id = 2;
  string backing_service_id = 3;
  string tenant_id = 4;
  string project_id = 5;
  string environment_id = 6;
  string service_id = 7;
  AttachConsumerTransition consumer = 8;
  oneof cleanup {
    AttachCredentialRemoval credential = 10;
    BackingHookProcedure custom_detach = 11;
  }
}

enum AttachNetworkAction {
  ATTACH_NETWORK_ACTION_UNSPECIFIED = 0;
  ATTACH_NETWORK_ACTION_CONNECT = 1;
  ATTACH_NETWORK_ACTION_DISCONNECT = 2;
}

// Captured direct Attach/Detach consumer update. Both artifacts describe the same
// native runtime; only this logical Service's backing-network membership changes.
message AttachConsumerTransition {
  string environment_id = 1;
  string backing_environment_id = 2;
  string service_id = 3;
  string network_id = 4;
  ComposeArtifact baseline = 5;
  ComposeArtifact candidate = 6;
  AttachNetworkAction action = 7;
}

message AttachConsumerHelperRequest {
  WorkAttemptIdentity attempt = 1;
  AttachConsumerTransition consumer = 2;
  bytes authority = 3; // canonical non-secret command authority
  WorkStartAck start = 4;
  bytes report = 5;
  AttachRemovalCheckpointAck acknowledgement = 6;
  bool inspect_only = 7;
  bytes recovery = 8; // captured forward failure; inspection-only recovery variant
  AttachProvisionCheckpointAck provision_acknowledgement = 9;
  bytes provision_recovery = 10;
}

message AttachConsumerHelperResponse {
  string service_id = 1;
  string network_id = 2;
  WorkInputReference input = 3;
  bool detached = 4;
  google.protobuf.Timestamp observed_at = 5;
  bool inspection = 6;
  bool connected = 7;
}

message AttachCredentialRemoval {
  string adapter_key = 1;
  BackingAuthentication authentication = 2;
  string role = 3;
  bytes password = 4; // only password-only authentication needs it for Detach
  string database = 5;
  repeated AttachGrantRemoval grants = 6;
}

message AttachGrantRemoval {
  string attach_id = 1;
  string database = 2;
}

message AttachRemovalCheckpointRequest {
  WorkAttemptIdentity attempt = 1;
  bytes report = 2;
}

message AttachRemovalCheckpointAck {
  WorkAttemptIdentity attempt = 1;
  bytes report = 2;
}

message AttachRemovalCompletionRequest {
  WorkAttemptIdentity attempt = 1;
  uint64 checkpoint_sequence = 2;
  WorkInputReference checkpoint_evidence = 3;
}

message AttachRemovalCompletionAck {
  WorkAttemptIdentity attempt = 1;
  uint64 checkpoint_sequence = 2;
  WorkInputReference checkpoint_evidence = 3;
  google.protobuf.Timestamp finished_at = 4;
  string outcome = 5;
}

message AttachRemovalFailureRequest {
  WorkAttemptIdentity attempt = 1;
  string reason = 2;
}

message AttachRemovalFailureAck {
  WorkAttemptIdentity attempt = 1;
  WorkInputReference evidence = 2;
  bytes failure = 3;
  string outcome = 4;
  google.protobuf.Timestamp finished_at = 5;
  google.protobuf.Timestamp started_at = 6;
}

// Canonical bounded removal progress, validated against captured host input.
// The acknowledgement echoes the exact report committed with its cursor.
message EnvironmentRemovalCheckpointRequest {
  WorkAttemptIdentity attempt = 1;
  bytes report = 2;
}

message EnvironmentRemovalCheckpointAck {
  WorkAttemptIdentity attempt = 1;
  bytes report = 2;
}

message EnvironmentRemovalCompletionRequest {
  WorkAttemptIdentity attempt = 1;
  uint64 checkpoint_sequence = 2;
  WorkInputReference checkpoint_evidence = 3;
}

message EnvironmentRemovalCompletionAck {
  WorkAttemptIdentity attempt = 1;
  uint64 checkpoint_sequence = 2;
  WorkInputReference checkpoint_evidence = 3;
  google.protobuf.Timestamp finished_at = 4;
}

message EnvironmentRemovalFailureRequest {
  WorkAttemptIdentity attempt = 1;
  string reason = 2;
}

message EnvironmentRemovalFailureAck {
  WorkAttemptIdentity attempt = 1;
  WorkInputReference evidence = 2;
  bytes failure = 3;
  string outcome = 4;
  google.protobuf.Timestamp finished_at = 5;
  google.protobuf.Timestamp started_at = 6;
}

// Local trusted-parent helper envelope. Agent channel authentication supplies
// the assignment; matching Start/report/ack authorize the captured boundary.
message EnvironmentRemovalHelperRequest {
  EnvironmentRemovalAssignment assignment = 1;
  WorkStartAck start = 2;
  EnvironmentRemovalCheckpointRequest report = 3;
  EnvironmentRemovalCheckpointAck acknowledgement = 4;
  bool inspect_only = 5;
}

message EnvironmentRemovalHelperResponse {
  string environment_id = 1;
  WorkInputReference captured_source = 2;
  bool runtime_absent = 3;
  bool directory_absent = 4;
  google.protobuf.Timestamp observed_at = 5;
  bool inspection = 6;
}

// Typed Release input. Delivery is not a grant to execute; WorkStartAck and
// operation checkpoints govern effects. No generic plan or numbered steps.
message ReleaseWorkAssignment {
  WorkAttemptIdentity attempt = 1;
  ReleaseWorkInput release = 2;
}

message ReleaseRecoveryAssignment {
  ReleaseWorkAssignment work = 1;
  bytes forward_attempt = 2;
  bytes failure = 3;
  // Separate Group restoration authority after a later member failed. Exactly
  // one of failure or group_restoration is present; successful source attempts
  // retain their actual outcome. No generic command or execution plan is sent.
  bytes group_restoration = 4;
  // Group Retry also carries the actual failed restoration attempt and its
  // failure receipt. It never replaces the successful source attempt above.
  bytes restoration_interruption = 5;
  WorkReleaseRecoveryDisposition disposition = 6;
}

// Canonical bounded Release cursor; its closed schema is owned by the Release
// executor. The Controller checks the transition against captured input before
// acknowledging it. It is not arbitrary diagnostic text or a generic plan.
message ReleaseRecoveryCheckpointRequest {
  WorkAttemptIdentity attempt = 1;
  bytes report = 2;
}

message ReleaseRecoveryCheckpointAck {
  WorkAttemptIdentity attempt = 1;
  bytes checkpoint = 2;
}

message ReleaseWorkCheckpointRequest {
  WorkAttemptIdentity attempt = 1;
  bytes report = 2;
}

message ReleaseWorkCheckpointAck {
  WorkAttemptIdentity attempt = 1;
  bytes checkpoint = 2;
}

// Requests settlement of the exact acknowledged Complete checkpoint. The
// Controller verifies operation proof; this is not a worker-supplied outcome.
message ReleaseWorkCompletionRequest {
  WorkAttemptIdentity attempt = 1;
  uint64 checkpoint_sequence = 2;
  WorkInputReference checkpoint_evidence = 3;
}

message ReleaseWorkCompletionAck {
  WorkAttemptIdentity attempt = 1;
  uint64 checkpoint_sequence = 2;
  WorkInputReference checkpoint_evidence = 3;
  string outcome = 4;
  google.protobuf.Timestamp finished_at = 5;
}

message ReleaseWorkFailureRequest {
  WorkAttemptIdentity attempt = 1;
  string reason = 2;
}

message ReleaseWorkFailureAck {
  WorkAttemptIdentity attempt = 1;
  WorkInputReference evidence = 2;
  bytes failure = 3;
  string outcome = 4;
  google.protobuf.Timestamp finished_at = 5;
  google.protobuf.Timestamp started_at = 6;
}

message ReleaseEffectEvidenceRequest {
  WorkAttemptIdentity attempt = 1;
  WorkInputReference evidence = 2;
  bytes record = 3;
}

message ReleaseEffectEvidenceAck {
  WorkAttemptIdentity attempt = 1;
  WorkInputReference evidence = 2;
}

// Standalone Script delivery carries only its captured input. Start and Script
// checkpoints, not delivery, authorize effects. Plaintext is transient.
message ScriptWorkAssignment {
  WorkAttemptIdentity attempt = 1;
  string operation_id = 2;
  RunScript run = 3;
  ResolvedRunnerSnapshot snapshot = 4;
  ScriptRunnerProjection projection = 5;
  ScriptBodyArtifact body = 6;
  repeated ScriptEntryArtifact entries = 7;
  ScriptExecutionCheckpoint checkpoint = 8;
}

message ScriptWorkCheckpointRequest {
  WorkAttemptIdentity attempt = 1;
  ScriptCheckpointRequest checkpoint = 2;
}

message ScriptWorkCheckpointAck {
  WorkAttemptIdentity attempt = 1;
  ScriptCheckpointAck checkpoint = 2;
}

message ScriptWorkCompletionRequest {
  WorkAttemptIdentity attempt = 1;
  uint64 checkpoint_sequence = 2;
  WorkInputReference checkpoint_evidence = 3;
}

message ScriptWorkCompletionAck {
  WorkAttemptIdentity attempt = 1;
  uint64 checkpoint_sequence = 2;
  WorkInputReference checkpoint_evidence = 3;
  string outcome = 4;
  google.protobuf.Timestamp finished_at = 5;
}

// Cleanup carries captured ownership only, never executable Script inputs.
message ScriptRecoveryAssignment {
  WorkAttemptIdentity attempt = 1;
  bytes forward_attempt = 2;
  string operation_id = 3;
  string execution_id = 4;
  ScriptRunnerProjection projection = 5;
  ScriptCleanupArtifacts artifacts = 6;
}

message ScriptRecoveryCompletionRequest {
  WorkAttemptIdentity attempt = 1;
  bytes proof = 2;
  WorkInputReference evidence = 3;
}

message ScriptRecoveryCompletionAck {
  WorkAttemptIdentity attempt = 1;
  WorkInputReference evidence = 2;
  google.protobuf.Timestamp finished_at = 3;
}

// Failure does not assert cleanup; the Controller derives that from its saved
// execution evidence. No subprocess output or secrets are carried here.
message ScriptWorkFailureRequest {
  WorkAttemptIdentity attempt = 1;
}

message ScriptWorkFailureAck {
  WorkAttemptIdentity attempt = 1;
  WorkInputReference evidence = 2;
  string outcome = 3;
  google.protobuf.Timestamp finished_at = 4;
}

// Captured file delivery is bounded to one 1 MiB file per request. Metadata
// lists at most 512 files. Content remains transient and is never Task history.
message ReleaseConfigurationRequest {
  WorkAttemptIdentity attempt = 1;
  string stage_id = 2;
}

message ComponentConfigurationRequest {
  WorkAttemptIdentity attempt = 1;
  string stage_id = 2;
}

message ComponentConfigurationFile {
  string destination = 1;
  string service_id = 2;
  string service_name = 3;
  string output_kind = 4;
  uint32 uid = 5;
  uint32 gid = 6;
  uint32 mode = 7;
  uint64 length = 8;
  bytes sha256 = 9;
}

message ComponentConfigurationManifest {
  WorkAttemptIdentity attempt = 1;
  string stage_id = 2;
  WorkConfigurationReference configuration = 3;
  repeated ComponentConfigurationFile files = 4;
}

message ComponentConfigurationFileRequest {
  WorkAttemptIdentity attempt = 1;
  string stage_id = 2;
  string destination = 3;
}

message ComponentConfigurationFileDelivery {
  WorkAttemptIdentity attempt = 1;
  string stage_id = 2;
  WorkConfigurationReference configuration = 3;
  ComponentConfigurationFile file = 4;
  bytes content = 5;
}

message ReleaseConfigurationFile {
  string destination = 1;
  string service_id = 2;
  string service_name = 3;
  string output_kind = 4;
  uint32 uid = 5;
  uint32 gid = 6;
  uint32 mode = 7;
  uint64 length = 8;
  bytes sha256 = 9;
}

message ReleaseConfigurationManifest {
  WorkAttemptIdentity attempt = 1;
  string stage_id = 2;
  WorkConfigurationReference configuration = 3;
  repeated ReleaseConfigurationFile files = 4;
}

message ReleaseConfigurationFileRequest {
  WorkAttemptIdentity attempt = 1;
  string stage_id = 2;
  string destination = 3;
}

message ReleaseConfigurationFileDelivery {
  WorkAttemptIdentity attempt = 1;
  string stage_id = 2;
  WorkConfigurationReference configuration = 3;
  ReleaseConfigurationFile file = 4;
  bytes content = 5;
}

// Local helper-container contract for a native Release effect. It carries the
// captured input and exact receipts, never a generic ExecutionPlan.
message ReleaseHelperRequest {
  ReleaseWorkAssignment assignment = 1;
  WorkStartAck start = 2;
  ReleaseWorkCheckpointRequest report = 3;
  ReleaseWorkCheckpointAck acknowledgement = 4;
  bool inspect_only = 5;
}

message ReleaseHelperResponse {
  bool succeeded = 1;
  bool mutation_attempted = 2;
  int32 exit_code = 3;
  bool absence_observed = 4;
  ServiceProxyEvidence proxy_evidence = 5;
  bool inspection = 6;
}

message ReleaseRecoveryHelperRequest {
  ReleaseRecoveryAssignment assignment = 1;
  WorkStartAck start = 2;
  ReleaseRecoveryCheckpointRequest report = 3;
  ReleaseRecoveryCheckpointAck acknowledgement = 4;
  bool inspect_only = 5;
}

message ReleaseRecoveryHelperResponse {
  bytes proof = 1;
}

enum WorkReleaseStrategy {
  WORK_RELEASE_STRATEGY_UNSPECIFIED = 0;
  WORK_RELEASE_STRATEGY_RECREATE = 1;
  WORK_RELEASE_STRATEGY_BLUE_GREEN = 2;
  WORK_RELEASE_STRATEGY_ROLLING = 3;
}

enum WorkReleaseFailurePolicy {
  WORK_RELEASE_FAILURE_POLICY_UNSPECIFIED = 0;
  WORK_RELEASE_FAILURE_POLICY_SWITCH_BACK = 1;
  WORK_RELEASE_FAILURE_POLICY_LEAVE_ACTIVE = 2;
}

enum WorkReleaseRecoveryDisposition {
  WORK_RELEASE_RECOVERY_DISPOSITION_UNSPECIFIED = 0;
  WORK_RELEASE_RECOVERY_DISPOSITION_RESTORE_CAPTURED = 1;
  WORK_RELEASE_RECOVERY_DISPOSITION_PRESERVE_SERVING = 2;
}

message ReleaseWorkInput {
  string operation_id = 1;
  string environment_id = 2;
  string service_id = 3;
  string release_id = 4;
  WorkReleaseStrategy strategy = 5;
  ComposeArtifact candidate = 6;
  ReleaseWorkPredecessor predecessor = 7; // always present, including explicit absence
  WorkConfigurationReference configuration = 8;
  WorkConfigurationReference prior_configuration = 9; // absent means captured absence
  repeated string configuration_destinations = 10;
  repeated ReleaseWorkHook hooks = 11;
  ReleaseWorkRolling rolling = 12;
  uint64 render_generation = 13;
  repeated bytes traffic_configurations = 14; // one complete routing manifest per cutover, in captured order
  WorkReleaseFailurePolicy failure_policy = 15; // captured operator decision; never inferred by the Agent
}

message ReleaseWorkPredecessor {
  bool absent = 1;
  string release_id = 2;
  string target = 3;
  bytes current_artifact = 4;
  bytes retained_artifact = 5;
}

message WorkConfigurationReference {
  string configuration_id = 1;
  string environment_id = 2;
  uint64 generation = 3;
  bytes sha256 = 4;
}

message ReleaseWorkHook {
  WorkInputReference input = 1;
  string execution_id = 2;
  string script_id = 3;
  string phase = 4;
  uint32 order = 5;
}

message ReleaseHookRequest {
  WorkAttemptIdentity attempt = 1;
  string execution_id = 2;
}

message ReleaseHookDelivery {
  WorkAttemptIdentity attempt = 1;
  string operation_id = 2;
  WorkInputReference input = 3;
  RunScript run = 4;
  ResolvedRunnerSnapshot snapshot = 5;
  ScriptRunnerProjection projection = 6;
  ScriptBodyArtifact body = 7;
  repeated ScriptEntryArtifact entries = 8;
  ScriptExecutionCheckpoint checkpoint = 9;
  ScriptCleanupArtifacts cleanup = 10;
  WorkInputReference interrupted_cleanup = 11; // proved cleanup of an earlier hook attempt; no new start
}

// Recovery-only metadata. No body bytes, Entry values, or start grant.
message ScriptCleanupArtifacts {
  ScriptBodyArtifactMetadata body_metadata = 1;
  ScriptBodyPreparedCheckpoint body_prepared = 2;
  ScriptContainerCreatedCheckpoint container_created = 3;
}

message ReleaseWorkRolling {
  uint32 replica_timeout_seconds = 1;
  repeated RollingReplica prior = 2;
  repeated RollingReplica candidate = 3;
  repeated RollingReplica retained = 4;
}

// AgentChannel is the one authenticated bidirectional stream. The Agent
// sends Authenticate as the first message and keeps the stream open for the
// life of the process, reconnecting with exponential backoff on drop.
service AgentChannel {
  rpc Connect(stream AgentMessage) returns (stream ControllerMessage);
}

message Authenticate {
  string agent_id = 1;
  bytes token = 2; // exactly 32 decoded bytes; never the base64url materialization
  uint32 execution_plan_schema = 3; // must match the current compiled schema
  bytes process_generation = 4; // exactly 16 bytes, distinct from durable Agent generation
  bytes postgres16_managed_release_sha256 = 5; // exactly 32 bytes
  uint32 channel_schema = 6; // must match the current channel, independently of sealed plan format
}

message AgentConfig {
  int32 pull_interval_seconds = 1;
  int32 max_concurrent_tasks = 2;
  repeated AgentLabel labels = 3; // sorted by unique key
}

message AgentLabel {
  string key = 1;
  string value = 2;
}

// ---- Agent -> Controller ----

message AgentMessage {
  reserved 3, 5, 6, 10, 12, 14, 38, 39;
  oneof payload {
    Authenticate authenticate = 1; // mandatory first message; no config or work is served before it succeeds
    Ready ready = 2;               // idle Ready IS the heartbeat; authoritative for dead-agent detection
    ObservedState observed_state = 4; // drift-detection feed for reconciliation
    LogEvent log_event = 7;
    LogEnd log_end = 8;
    LogReady log_ready = 9;
    WorkloadImageResolutionResult workload_image_resolution_result = 11;
    ServiceObservationResult service_observation_result = 13;
    BackingAccessResult backing_access_result = 15;
