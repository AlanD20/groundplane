enum ExecutionStepPolicy {
  EXECUTION_STEP_POLICY_UNSPECIFIED = 0;
  EXECUTION_STEP_POLICY_RELEASE_FORWARD = 1;
  EXECUTION_STEP_POLICY_RELEASE_COMPENSATE = 2;
  EXECUTION_STEP_POLICY_RELEASE_RECOVERY_PROBE = 3;
  EXECUTION_STEP_POLICY_RELEASE_RECOVERY_COMPENSATE = 4;
  EXECUTION_STEP_POLICY_RELEASE_PRE_HOOK = 5;
  EXECUTION_STEP_POLICY_RELEASE_POST_HOOK = 6;
  EXECUTION_STEP_POLICY_RELEASE_FAILURE_HOOK = 7;
}

// Schema-one Backup authority and evidence. Digests and execution nonces are
// exactly 32 bytes; stable resource ids are never mutable names. These typed
// messages contain no plaintext credentials or age identity.
message RevisionDigest {
  int64 mod_revision = 1; // positive durable etcd revision
  bytes sha256 = 2;
}

message CheckpointFence {
  bytes authority_digest = 1;
  int64 dedupe_key_mod_revision = 2;
}

enum BackupResourceKind {
  BACKUP_RESOURCE_KIND_UNSPECIFIED = 0;
  BACKUP_RESOURCE_KIND_ATTACH = 1;
  BACKUP_RESOURCE_KIND_ENVIRONMENT = 2;
  BACKUP_RESOURCE_KIND_VOLUME = 3;
}

message BackupResourceIdentity {
  BackupResourceKind kind = 1;
  string resource_id = 2;
  RevisionDigest resource = 3;
}

enum BackupEncryption {
  BACKUP_ENCRYPTION_UNSPECIFIED = 0;
  BACKUP_ENCRYPTION_NONE = 1;
  BACKUP_ENCRYPTION_AGE = 2;
}

message BackupEncryptionAuthority {
  BackupEncryption kind = 1;
  string secret_slot_id = 2;
  bytes recipient_sha256 = 3;
  RevisionDigest secret_slot = 4;
  optional uint64 key_era = 5; // frozen object metadata; absent only for none
}

enum BackupServiceRuntimeIntent {
  BACKUP_SERVICE_RUNTIME_INTENT_UNSPECIFIED = 0;
  BACKUP_SERVICE_RUNTIME_INTENT_RUNNING = 1;
  BACKUP_SERVICE_RUNTIME_INTENT_STOPPED = 2;
  BACKUP_SERVICE_RUNTIME_INTENT_ABSENT = 3;
}

message BackupPriorRuntimeIntent {
  BackupServiceRuntimeIntent kind = 1;
  RevisionDigest intent = 2; // separate Controller-owned ServiceRuntime record
}

message BackupServiceFact {
  string service_id = 1;
  string current_name = 2;
  RevisionDigest service = 3;
  RevisionDigest compose = 4;
  BackupPriorRuntimeIntent prior_runtime_intent = 5;
  uint32 required_label_count = 6;
  bytes required_labels_sha256 = 7;
  bytes local_image_id_sha256 = 8; // decoded sha256: local image ID, not an OCI repository digest
}

message BackupConnectorAuthority {
  string connector_id = 1;
  RevisionDigest connector = 2;
  string canonical_endpoint_url = 3;
  string region = 4;
  optional bool path_style = 5; // presence required
  string prefix = 6;
  string access_key_slot_id = 7;
  string secret_key_slot_id = 8;
  RevisionDigest access_key_slot = 9;
  RevisionDigest secret_key_slot = 10;
}

message BackupObjectTarget {
  BackupConnectorAuthority connector = 1;
  string bucket = 2;
  string object_key = 3;
}

// A present VersionId, including empty string or literal "null", never falls
// back to ETag. Wrapper presence is the immutable discriminator.
message BackupS3VersionId {
  string value = 1;
}

message BackupS3ETag {
  string value = 1;
}

message BackupObjectIdentity {
  BackupConnectorAuthority connector = 1;
  string bucket = 2;
  string object_key = 3;
  oneof discriminator {
    BackupS3VersionId version_id = 4;
    BackupS3ETag etag = 5;
  }
}

message BackupArtifactEvidence {
  uint64 source_size_bytes = 1;
  bytes source_sha256 = 2;
  uint64 stored_size_bytes = 3;
  bytes stored_sha256 = 4;
}

message BackupTaskAuthority {
  uint32 authority_schema = 1; // exactly one
  string task_id = 2;
  string operation_id = 3;
  uint32 task_attempt = 4;
  bytes plan_hash = 5;
  string project_id = 6;
  RevisionDigest project = 7;
  string environment_id = 8;
  RevisionDigest environment = 9;
  uint64 task_deadline_unix_nano = 10; // absolute, never extended on reconnect
  string assignment_id = 11;
  uint64 assignment_generation = 12;
  repeated BackupServiceFact services = 13;
  repeated BackupStepAuthority steps = 14;
}

// Sealed once during publication. Assignment adds only its exact delivery
// identity and absolute claim deadline; reconnect never rereads live resources.
message BackupPlanScope {
  string project_id = 1;
  RevisionDigest project = 2;
  string environment_id = 3;
  RevisionDigest environment = 4;
  repeated BackupServiceFact services = 5;
  uint32 task_attempt = 6;
}

message BackupStepAuthority {
  string step_id = 1;
  string execution_id = 2;
  bytes step_digest = 3;
  uint64 step_deadline_unix_nano = 4;
  repeated string consumer_service_ids = 5;
  oneof operation {
    BackupCaptureAuthority capture = 10;
    BackupPruneAuthority prune = 11;
    BackupRestoreAuthority restore = 12;
  }
}

message BackupTaskResume {
  string assignment_id = 1;
  uint64 assignment_generation = 2;
  repeated BackupStepResume steps = 3;
}

message BackupStepResume {
  string step_id = 1;
  string execution_id = 2;
  oneof operation {
    BackupCaptureResume capture = 10;
    BackupPruneResume prune = 11;
    BackupRestoreResume restore = 12;
  }
}

enum BackupCapturePhase {
  BACKUP_CAPTURE_PHASE_UNSPECIFIED = 0;
  BACKUP_CAPTURE_PHASE_CAPTURING = 1;
  BACKUP_CAPTURE_PHASE_ARTIFACT_PREPARED = 2;
  BACKUP_CAPTURE_PHASE_UPLOADING = 3;
  BACKUP_CAPTURE_PHASE_HEAD_VERIFICATION = 4;
  BACKUP_CAPTURE_PHASE_POINT_COMMIT = 5;
  BACKUP_CAPTURE_PHASE_SOURCE_CLEANUP = 6;
  BACKUP_CAPTURE_PHASE_SERVICE_RECOVERY = 7;
  BACKUP_CAPTURE_PHASE_TERMINAL = 8;
}

enum BackupRestorePhase {
  BACKUP_RESTORE_PHASE_UNSPECIFIED = 0;
  BACKUP_RESTORE_PHASE_ARTIFACT_VALIDATION = 1;
  BACKUP_RESTORE_PHASE_TARGET_PREPARATION = 2;
  BACKUP_RESTORE_PHASE_TARGET_MUTATION = 3;
  BACKUP_RESTORE_PHASE_PUBLICATION = 4;
  BACKUP_RESTORE_PHASE_CLEANUP = 5;
  BACKUP_RESTORE_PHASE_SERVICE_RECOVERY = 6;
  BACKUP_RESTORE_PHASE_TERMINAL = 7;
}

message BackupCaptureResume {
  uint64 checkpoint_sequence = 1;
  CheckpointFence preceding_checkpoint = 2;
  BackupCapturePhase phase = 3;
  BackupCaptureCursor cursor = 4;
  // Retain the original archive and byte evidence after the checkpoint advances.
  // Absent before Prepared; immutable for the remainder of this capture.
  BackupArtifactPrepared prepared_artifact = 5;
  BackupPostgresDumpStart dump_start = 6;
  oneof checkpoint {
    BackupArtifactPrepared artifact_prepared = 10;
    BackupUploadVerified upload_verified = 11;
    BackupSourceCleanupCompleted source_cleanup_completed = 12;
    BackupPostgresContainerObserved postgres_container_observed = 13;
    BackupPostgresDumpStart postgres_dump_start = 14;
    BackupVolumeProgress volume_progress = 15;
    BackupConfigProgress config_progress = 16;
    BackupUploadCompleted upload_completed = 17;
  }
}

message BackupPruneResume {
  uint64 checkpoint_sequence = 1;
  CheckpointFence preceding_checkpoint = 2;
  uint32 next_object_ordinal = 3;
  oneof checkpoint {
    BackupPruneObjectDeleted object_deleted = 10;
  }
}

message BackupRestoreResume {
  uint64 checkpoint_sequence = 1;
  CheckpointFence preceding_checkpoint = 2;
  BackupRestorePhase phase = 3;
  BackupRestoreCursor cursor = 4;
  BackupPostgresRestoreApplyStartCheckpoint apply_start = 5;
  oneof checkpoint {
    BackupRestoreArtifactValidated artifact_validated = 10;
    BackupPostgresContainerObserved postgres_container_observed = 11;
    BackupPostgresRestoreApplyStartCheckpoint postgres_restore_apply_start = 12;
    BackupConfigProgress config_progress = 13;
    BackupVolumeProgress volume_progress = 14;
    BackupPostgresRestoreVerified postgres_restore_verified = 15;
    BackupPostgresServiceProgress postgres_service_progress = 16;
    BackupSourceCleanupCompleted source_cleanup_completed = 17;
  }
}

message BackupCaptureCursor {
