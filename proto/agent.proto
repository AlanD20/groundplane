  uint64 service_revision = 2;
  BackupServiceRuntimeIntent prior_intent = 3;
  string compose_key = 4;
  repeated string mount_paths = 5;
}

enum BackupServiceRuntimeIntent {
  BACKUP_SERVICE_RUNTIME_INTENT_UNSPECIFIED = 0;
  BACKUP_SERVICE_RUNTIME_INTENT_RUNNING = 1;
  BACKUP_SERVICE_RUNTIME_INTENT_STOPPED = 2;
  BACKUP_SERVICE_RUNTIME_INTENT_ABSENT = 3;
}

// A checkpoint request is private assignment traffic. Sequence is one-based
// and contiguous within the exact task/assignment/step tuple. The digest is
// the canonical Controller-protected control payload; it contains no
// Secret-derived fingerprint.
message BackupCheckpointRequest {
  string task_id = 1;
  string assignment_id = 2;
  string step_id = 3;
  uint32 sequence = 4;
  BackupCheckpointKind kind = 5;
  bytes control_payload_sha256 = 6;
  oneof payload {
    BackupArtifactPreparedCheckpoint artifact_prepared = 7;
    BackupUploadVerifiedCheckpoint upload_verified = 8;
    BackupSourceCleanupCompletedCheckpoint source_cleanup_completed = 9;
    BackupRestoreArtifactValidatedCheckpoint restore_artifact_validated = 10;
    BackupVolumeTreeStagedCheckpoint volume_tree_staged = 11;
    BackupVolumeTreeExchangedCheckpoint volume_tree_exchanged = 12;
    BackupVolumeReplacedTreeCleanedCheckpoint volume_replaced_tree_cleaned = 13;
    BackupConfigGenerationStagedCheckpoint config_generation_staged = 14;
    BackupConfigGenerationActivatedCheckpoint config_generation_activated = 15;
    BackupPostgresRestoreVerifiedCheckpoint postgres_restore_verified = 16;
    BackupRemoteObjectAbsentCheckpoint remote_object_absent = 17;
    BackupUploadCompletedCheckpoint upload_completed = 18;
  }
}

// A future Controller sends this only after the domain checkpoint,
// deduplication evidence, next-sequence cursor, and required lock/epoch change
// commit atomically. It echoes the delivery identity and nothing else.
message BackupCheckpointAck {
  string task_id = 1;
  string assignment_id = 2;
  string step_id = 3;
  uint32 sequence = 4;
}

// BackupSecretSlotTransfer is transient Controller-to-Agent traffic. Every
// record repeats the complete assignment/purpose fence. Config Entry content
// uses its own typed transfer and is never a secret-slot purpose.
message BackupSecretSlotTransfer {
  string task_id = 1;
  string assignment_id = 2;
  string step_id = 3;
  BackupSecretSlotPurpose purpose = 4;
  oneof record {
    BackupSecretSlotHeader header = 5;
    BackupSecretSlotChunk chunk = 6;
    BackupSecretSlotEnd end = 7;
  }
}

enum BackupSecretSlotPurpose {
  BACKUP_SECRET_SLOT_PURPOSE_UNSPECIFIED = 0;
  BACKUP_SECRET_SLOT_PURPOSE_S3_ACCESS_KEY = 1;
  BACKUP_SECRET_SLOT_PURPOSE_S3_SECRET_KEY = 2;
  BACKUP_SECRET_SLOT_PURPOSE_CURRENT_AGE_IDENTITY = 3;
  BACKUP_SECRET_SLOT_PURPOSE_OPERATOR_OLD_AGE_IDENTITY = 4;
}

message BackupSecretSlotHeader {
  uint64 total_bytes = 1;
  uint32 chunk_count = 2;
}

message BackupSecretSlotChunk {
  uint32 sequence = 1; // one-based and contiguous within the exact slot fence
  bytes content = 2;   // at most 32 KiB; transient and cleared after consumption
}

message BackupSecretSlotEnd {
  uint32 chunk_count = 1;
}

enum BackupCheckpointKind {
  BACKUP_CHECKPOINT_KIND_UNSPECIFIED = 0;
  BACKUP_CHECKPOINT_KIND_ARTIFACT_PREPARED = 1;
  BACKUP_CHECKPOINT_KIND_UPLOAD_VERIFIED = 2;
  BACKUP_CHECKPOINT_KIND_SOURCE_CLEANUP_COMPLETED = 3;
  BACKUP_CHECKPOINT_KIND_RESTORE_ARTIFACT_VALIDATED = 4;
  BACKUP_CHECKPOINT_KIND_VOLUME_TREE_STAGED = 5;
  BACKUP_CHECKPOINT_KIND_VOLUME_TREE_EXCHANGED = 6;
  BACKUP_CHECKPOINT_KIND_VOLUME_REPLACED_TREE_CLEANED = 7;
  BACKUP_CHECKPOINT_KIND_CONFIG_GENERATION_STAGED = 8;
  BACKUP_CHECKPOINT_KIND_CONFIG_GENERATION_ACTIVATED = 9;
  BACKUP_CHECKPOINT_KIND_POSTGRES_RESTORE_VERIFIED = 10;
  BACKUP_CHECKPOINT_KIND_REMOTE_OBJECT_ABSENT = 11;
  BACKUP_CHECKPOINT_KIND_UPLOAD_COMPLETED = 12;
}

message BackupArtifactPreparedCheckpoint {
  string point_id = 1;
  uint64 stored_size_bytes = 2;
  bytes stored_sha256 = 3;
}

message BackupUploadCompletedCheckpoint {
  string point_id = 1;
  uint64 stored_size_bytes = 2;
  bytes stored_sha256 = 3;
}

message BackupUploadVerifiedCheckpoint {
  string point_id = 1;
  uint64 stored_size_bytes = 2;
  bytes stored_sha256 = 3;
}

message BackupSourceCleanupCompletedCheckpoint {
  string point_id = 1;
}

message BackupRestoreArtifactValidatedCheckpoint {
