  string connector_endpoint = 1;
  string connector_bucket = 2;
  string connector_prefix = 3;
  string connector_region = 4;
  BackupS3Addressing connector_addressing = 5;
  string protected_object_key = 6;
  bool immutable_create = 7;
  bool put_after_artifact_prepared_ack = 8;
  bool head_after_upload_completed_ack = 9;
}

// BackupArtifactPrune is one ordered Recovery Point authority. Credentials
// arrive only through the existing assignment/step-fenced S3 secret slots.
