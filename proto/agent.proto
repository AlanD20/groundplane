}

message ScriptCleanupCheckpoint {
  string container_id = 1;
  uint64 body_device = 2;
  uint64 body_inode = 3;
  string body_leaf = 4;
  bool container_absent = 5;
  bool body_absent = 6;
  bool execution_directory_absent = 7;
}

message ScriptExecutionCheckpoint {
  ScriptExecutionState state = 1;
  bool start_authorized = 2;
  ScriptBodyPreparedCheckpoint body_prepared = 3;
  ScriptContainerCreatedCheckpoint container_created = 4;
  ScriptOutcomeCheckpoint outcome = 5;
  ScriptCleanupCheckpoint cleanup = 6;
  bool reconciliation_required = 7;
  string script_execution_id = 8;
}

message ScriptCheckpointRequest {
  string task_id = 1;
  string operation_id = 2;
  string work_item_id = 3;
  string attempt_id = 4;
  string script_execution_id = 5;
  bytes input_sha256 = 6;
  ScriptExecutionState expected_state = 7;
  ScriptExecutionState state = 8;
  string input_id = 9;
  oneof evidence {
    ScriptStartAuthorizedCheckpoint start_authorized = 10;
    ScriptBodyPreparedCheckpoint body_prepared = 11;
    ScriptContainerCreatedCheckpoint container_created = 12;
    ScriptOutcomeCheckpoint outcome = 13;
    ScriptCleanupCheckpoint cleanup = 14;
  }
  uint64 sequence = 15;
  string stage_id = 16;
  google.protobuf.Timestamp recorded_at = 17;
}

