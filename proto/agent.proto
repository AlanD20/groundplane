  string reason = 2;
}

message BackupWorkFailureAck {
  WorkAttemptIdentity attempt = 1;
  WorkInputReference evidence = 2;
  bytes failure = 3;
  string outcome = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp finished_at = 6;
}

message BackupWorkCompletionAck {
  WorkAttemptIdentity attempt = 1;
  WorkInputReference evidence = 2;
  google.protobuf.Timestamp started_at = 3;
  google.protobuf.Timestamp finished_at = 4;
  string outcome = 5;
}

message BackupWorkCheckpointAck {
  WorkAttemptIdentity attempt = 1;
  uint32 source_ordinal = 2;
  uint64 checkpoint_sequence = 3;
  CheckpointFence committed = 4;
  bytes request_sha256 = 5;
  BackupStepResume source = 6;
}

message BackupPlanScope {
  string project_id = 1;
  RevisionDigest project = 2;
  string environment_id = 3;
  RevisionDigest environment = 4;
  repeated BackupServiceFact services = 5;
  uint32 task_attempt = 6;
}

message BackupStepAuthority {
  string step_id = 1;
  string execution_id = 2;
  bytes step_digest = 3;
  uint64 step_deadline_unix_nano = 4;
  repeated string consumer_service_ids = 5;
  oneof operation {
    BackupCaptureAuthority capture = 10;
    BackupPruneAuthority prune = 11;
    BackupRestoreAuthority restore = 12;
  }
}

message BackupTaskResume {
  string assignment_id = 1;
  uint64 assignment_generation = 2;
  repeated BackupStepResume steps = 3;
}

message BackupStepResume {
  string step_id = 1;
  string execution_id = 2;
  oneof operation {
    BackupCaptureResume capture = 10;
    BackupPruneResume prune = 11;
    BackupRestoreResume restore = 12;
  }
}

enum BackupCapturePhase {
  BACKUP_CAPTURE_PHASE_UNSPECIFIED = 0;
  BACKUP_CAPTURE_PHASE_CAPTURING = 1;
  BACKUP_CAPTURE_PHASE_ARTIFACT_PREPARED = 2;
  BACKUP_CAPTURE_PHASE_UPLOADING = 3;
  BACKUP_CAPTURE_PHASE_HEAD_VERIFICATION = 4;
  BACKUP_CAPTURE_PHASE_POINT_COMMIT = 5;
  BACKUP_CAPTURE_PHASE_SOURCE_CLEANUP = 6;
  BACKUP_CAPTURE_PHASE_SERVICE_RECOVERY = 7;
  BACKUP_CAPTURE_PHASE_TERMINAL = 8;
}

enum BackupRestorePhase {
  BACKUP_RESTORE_PHASE_UNSPECIFIED = 0;
  BACKUP_RESTORE_PHASE_ARTIFACT_VALIDATION = 1;
  BACKUP_RESTORE_PHASE_TARGET_PREPARATION = 2;
  BACKUP_RESTORE_PHASE_TARGET_MUTATION = 3;
  BACKUP_RESTORE_PHASE_PUBLICATION = 4;
  BACKUP_RESTORE_PHASE_CLEANUP = 5;
  BACKUP_RESTORE_PHASE_SERVICE_RECOVERY = 6;
  BACKUP_RESTORE_PHASE_TERMINAL = 7;
}

message BackupCaptureResume {
  uint64 checkpoint_sequence = 1;
  CheckpointFence preceding_checkpoint = 2;
  BackupCapturePhase phase = 3;
  BackupCaptureCursor cursor = 4;
  // Retain the original archive and byte evidence after the checkpoint advances.
  // Absent before Prepared; immutable for the remainder of this capture.
  BackupArtifactPrepared prepared_artifact = 5;
  BackupPostgresDumpStart dump_start = 6;
  BackupMySQLDumpStart mysql_dump_start = 7;
  oneof checkpoint {
    BackupArtifactPrepared artifact_prepared = 10;
    BackupUploadVerified upload_verified = 11;
    BackupSourceCleanupCompleted source_cleanup_completed = 12;
    BackupPostgresContainerObserved postgres_container_observed = 13;
    BackupPostgresDumpStart postgres_dump_start = 14;
    BackupVolumeProgress volume_progress = 15;
    BackupConfigProgress config_progress = 16;
    BackupUploadCompleted upload_completed = 17;
    BackupMySQLContainerObserved mysql_container_observed = 18;
    BackupMySQLDumpStart mysql_dump_start_checkpoint = 19;
  }
}

message BackupPruneResume {
  uint64 checkpoint_sequence = 1;
  CheckpointFence preceding_checkpoint = 2;
  uint32 next_object_ordinal = 3;
  oneof checkpoint {
    BackupPruneObjectDeleted object_deleted = 10;
  }
}

message BackupRestoreResume {
  uint64 checkpoint_sequence = 1;
  CheckpointFence preceding_checkpoint = 2;
  BackupRestorePhase phase = 3;
  BackupRestoreCursor cursor = 4;
  BackupPostgresRestoreApplyStartCheckpoint apply_start = 5;
  BackupMySQLRestoreApplyStartCheckpoint mysql_apply_start = 6;
  BackupDatabaseRestoreProgress database_progress = 7;
  oneof checkpoint {
    BackupRestoreArtifactValidated artifact_validated = 10;
    BackupPostgresContainerObserved postgres_container_observed = 11;
    BackupPostgresRestoreApplyStartCheckpoint postgres_restore_apply_start = 12;
    BackupConfigProgress config_progress = 13;
    BackupVolumeProgress volume_progress = 14;
    BackupPostgresRestoreVerified postgres_restore_verified = 15;
    BackupPostgresServiceProgress postgres_service_progress = 16;
    BackupSourceCleanupCompleted source_cleanup_completed = 17;
    BackupMySQLContainerObserved mysql_container_observed = 18;
    BackupMySQLRestoreApplyStartCheckpoint mysql_restore_apply_start = 19;
    BackupMySQLRestoreVerified mysql_restore_verified = 20;
    BackupMySQLServiceProgress mysql_service_progress = 21;
  }
}

// Constant-size cumulative database restore state; reassignment does not replay
// diagnostic history to recover container identity or consumer stop/restart order.
message BackupDatabaseRestoreProgress {
  uint32 stopped_consumers = 1;
  uint32 recovered_consumers = 2;
  BackupServicePhase consumer_phase = 3;
  BackupPostgresContainerObserved postgres_observed = 4;
  BackupMySQLContainerObserved mysql_observed = 5;
  BackupPostgresRestoreVerified postgres_verified = 6;
  BackupMySQLRestoreVerified mysql_verified = 7;
  bool consumers_only = 8; // recovery before any database apply was authorized
}

message BackupDatabaseConsumerRecovery {
  string point_id = 1;
}

message BackupCaptureCursor {
  uint32 object_attempt = 1;
  uint64 config_record_sequence = 2;
  uint32 config_value_ordinal = 3;
  uint32 service_cursor = 4;
  bytes cumulative_chain_sha256 = 5;
}

message BackupRestoreCursor {
  uint32 object_attempt = 1;
  uint64 config_record_sequence = 2;
  uint32 config_value_ordinal = 3;
  uint64 volume_cursor = 4;
  uint32 service_cursor = 5;
  bytes cumulative_chain_sha256 = 6;
}


message BackupCaptureAuthority {
  reserved 5;
  reserved "services";
  string point_id = 1;
  BackupResourceIdentity resource = 2;
  BackupObjectTarget target = 3;
  BackupEncryptionAuthority encryption = 4;
  oneof source {
    BackupPostgresCaptureAuthority postgres = 10;
    BackupConfigCaptureAuthority config = 11;
    BackupVolumeCaptureAuthority volume = 12;
    BackupMySQLCaptureAuthority mysql = 13;
  }
}

message BackupRestoreAuthority {
  reserved 6;
  reserved "services";
  string point_id = 1;
  BackupResourceIdentity destination = 2;
  BackupObjectIdentity source_object = 3;
  BackupArtifactEvidence expected_evidence = 4;
  BackupEncryptionAuthority encryption = 5;
  oneof source {
    BackupPostgresRestoreAuthority postgres = 10;
    BackupConfigRestoreAuthority config = 11;
    BackupVolumeRestoreAuthority volume = 12;
    BackupMySQLRestoreAuthority mysql = 13;
  }
  oneof identity {
    BackupOriginalIdentity original_identity = 20;
    BackupAdoptedIdentity adopted_identity = 21;
  }
}

message BackupPruneAuthority {
  RevisionDigest retention_policy = 1;
  repeated BackupPruneObject objects = 2;
}

message BackupOriginalIdentity {
  string original_execution_id = 1;
  BackupResourceIdentity destination = 2;
  string original_assignment_id = 3;
}

message BackupAdoptedIdentity {
  string adoption_id = 1;
  string predecessor_execution_id = 2;
  CheckpointFence predecessor_fence = 3;
  int64 adoption_mod_revision = 4;
  string predecessor_assignment_id = 5;
  string adopted_assignment_id = 6;
}

message BackupPruneObject {
  uint32 ordinal = 1;
  string point_id = 2;
  RevisionDigest point = 3;
  BackupArtifactEvidence evidence = 4;
  BackupObjectIdentity object = 5;
  uint32 metadata_count = 6;
  bytes metadata_sha256 = 7;
}

message BackupPruneObjectDeleted {
  uint32 ordinal = 1;
  string point_id = 2;
  BackupObjectIdentity object = 3;
}

// Startup inventory contains at most 32 total stage and private Volume
// Restore rows, each group in recovery-key order. Stages carry one or two
// unique role-ordered files. Recovery repeats exact evidence; silence never
// grants discard permission.
message BackupStagingInventory {
  repeated BackupRecoveredStage entries = 1;
  repeated BackupRecoveredVolumeRestore volume_restores = 2;
}

// The two private Volume metadata journals are inventoried as one exact
// Restore generation. Neither a path nor an unbounded manifest is sent.
message BackupRecoveredVolumeRestore {
  bytes recovery_key_sha256 = 1;
  WorkAttemptIdentity attempt = 2;
  string restore_generation_id = 3;
  bytes authority_sha256 = 4;
  bool journal_present = 5;
  bytes old_manifest_sha256 = 6;
  bytes old_full_tree_sha256 = 7;
  bytes new_manifest_sha256 = 8;
  bytes new_full_tree_sha256 = 9;
  uint64 old_entry_count = 10;
  uint64 new_entry_count = 11;
  uint64 journal_record_count = 12;
  bytes journal_chain_sha256 = 13;
  bool journal_pending = 14;
  bool journal_root_deleted = 15;
  bool receiver_present = 16;
  uint64 receiver_committed_record_sequence = 17;
  bool receiver_complete = 18;
  bool receiver_partial = 19;
  bool journal_partial = 20;
  bool journal_retiring = 21;
  bool receiver_retiring = 22;
  bytes receiver_content_manifest_sha256 = 23;
  bytes receiver_full_tree_sha256 = 24;
  bytes receiver_source_sha256 = 25;
  uint64 receiver_entry_count = 26;
  bool journal_discarding = 27;
  bool receiver_discarding = 28;
  uint32 source_ordinal = 29;
  string point_id = 30;
}

message BackupRecoveredStage {
  bytes recovery_key_sha256 = 1;
  repeated BackupRecoveredFile files = 2;
  // Durable execution marker survives source-file cleanup until helper state
  // is classified under a Controller disposition. It may have no files.
  bool database_execution = 3;
}

enum BackupRecoveredFileRole {
  BACKUP_RECOVERED_FILE_ROLE_UNSPECIFIED = 0;
  BACKUP_RECOVERED_FILE_ROLE_SOURCE_PLAINTEXT = 1;
  BACKUP_RECOVERED_FILE_ROLE_STORED_OBJECT = 2;
}

message BackupRecoveredFile {
  BackupRecoveredFileRole role = 1;
  uint64 size_bytes = 2;
  bytes sha256 = 3;
}

message BackupStagingRecoveryPlan {
  bytes inventory_sha256 = 1;
  repeated BackupStagingDisposition dispositions = 2;
  repeated BackupVolumeRestoreRecoveryDisposition volume_dispositions = 3;
  // Reclassification after native authority changes while delivery is pending.
  // The exact predecessor plan remains identified; inventory cannot change.
  bytes supersedes_plan_sha256 = 4;
}

message BackupVolumeRestoreRecoveryDisposition {
  bytes recovery_key_sha256 = 1;
  oneof disposition {
    BackupVolumeRestoreResume resume = 2;
    BackupVolumeRestoreHold hold = 3;
    BackupVolumeRestoreCleanup cleanup = 4;
  }
}

message BackupVolumeRestoreResume {
  bytes assignment_resume_sha256 = 1;
  int64 native_restore_mod_revision = 2;
  bytes native_restore_sha256 = 3;
}

message BackupVolumeRestoreHold {
  int64 native_restore_mod_revision = 1;
  bytes native_restore_sha256 = 2;
}

message BackupVolumeRestoreCleanup {
  int64 native_restore_mod_revision = 1;
  bytes native_restore_sha256 = 2;
}

message BackupStagingDisposition {
  bytes recovery_key_sha256 = 1;
  oneof disposition {
    BackupResumePrepared resume_prepared = 2;
    BackupDiscardRecovered discard_recovered = 3;
    BackupRecoveryRequired recovery_required = 4;
  }
  BackupDatabaseStagingGuard database_guard = 5;
}

// Exact retained release and runtime selection, never current desired state.
// Inspection grants no client execution or file cleanup authority by itself.
message BackupDatabaseStagingGuard {
  string task_id = 1;
  BackupStepAuthority step = 2;
  BackupServiceFact database_service = 3;
  ComposeArtifact database_artifact = 4;
  // Present only for the exact terminal native RecoveryRequired apply attempt.
  oneof recovery_apply {
    BackupPostgresRestoreApplyStartCheckpoint postgres_recovery_apply = 5;
    BackupMySQLRestoreApplyStartCheckpoint mysql_recovery_apply = 8;
  }
  // Only a terminal safe/completed Task permits namespace retirement and
  // removal of its execution marker. Live resume and recovery holds do not.
  bool terminal_cleanup = 6;
  // Native completion already proves helper retirement. Only forget this
  // Task's marker; the database may now belong to a different operation.
  bool completed_task = 7;
}

enum BackupRemainingGrowth {
  BACKUP_REMAINING_GROWTH_UNSPECIFIED = 0;
  BACKUP_REMAINING_GROWTH_NO_GROWTH = 1;
  BACKUP_REMAINING_GROWTH_BOUNDED = 2;
  BACKUP_REMAINING_GROWTH_EXCLUSIVE_UNKNOWN = 3;
}

message BackupResumePrepared {
  bytes assignment_resume_sha256 = 1;
  BackupRemainingGrowth remaining_growth = 2;
  uint64 required_growth_bytes = 3; // positive only for bounded growth
  repeated BackupRecoveredFile expected_files = 4;
  // Config capture only, before ArtifactPrepared selected ciphertext. Preserve
  // the independently verified complete source; retire only derived ciphertext.
  BackupRestartConfigEncryption restart_config_encryption = 5;
  // Database capture only, before ArtifactPrepared. Preserve the inventoried
  // source for original-Exec verification; retire only unselected ciphertext.
  BackupRestartDatabaseEncryption restart_database_encryption = 6;
}

message BackupRestartConfigEncryption {}
message BackupRestartDatabaseEncryption {}

message BackupDiscardRecovered {}

// Classified unresolved mutation: preserve the exact files without granting
// execution, cleanup or growth authority. Other owned work may become Ready.
message BackupRecoveryRequired {
  int64 native_restore_mod_revision = 1;
  bytes native_restore_sha256 = 2;
  repeated BackupRecoveredFile expected_files = 3;
}

message BackupStagingRecoveryAck {
  bytes inventory_sha256 = 1;
  bytes applied_plan_sha256 = 2;
  uint32 applied_disposition_count = 3;
}

enum BackupConfigDirection {
  BACKUP_CONFIG_DIRECTION_UNSPECIFIED = 0;
  BACKUP_CONFIG_DIRECTION_CAPTURE = 1;
  BACKUP_CONFIG_DIRECTION_RESTORE = 2;
}

message BackupConfigTransfer {
  WorkAttemptIdentity attempt = 1;
  uint32 source_ordinal = 2;
  bytes authority_digest = 3;
  string transfer_id = 4;
  uint64 record_sequence = 5;
  oneof record {
    BackupConfigTransferStart start = 10;
    BackupConfigEntryHeader entry_header = 11;
    BackupConfigValueChunk value_chunk = 12;
    BackupConfigEntryEnd entry_end = 13;
    BackupConfigTransferEnd end = 14;
    BackupConfigTransferResume resume = 15;
  }
}

message BackupConfigTransferStart {
  BackupConfigDirection direction = 1;
  BackupConfigContentAuthority content = 2;
}

message BackupConfigEntryHeader {
  oneof entry {
    BackupConfigEntry capture_entry = 1;
    BackupConfigRestoreEntry restore_entry = 2;
  }
  uint32 chunk_count = 3;
}

message BackupConfigValueChunk {
  uint32 ordinal = 1;
  uint64 offset = 2;
  bytes content = 3;
}

message BackupConfigEntryEnd {
  uint32 ordinal = 1;
  uint64 value_size_bytes = 2;
  bytes value_sha256 = 3;
}

message BackupConfigTransferEnd {
  BackupConfigDirection direction = 1;
  BackupConfigContentAuthority content = 2;
  bytes transcript_sha256 = 3;
}

message BackupConfigTransferResume {
  reserved 1, 2, 4, 5, 7, 8, 9;
  reserved "direction", "next_record_sequence", "metadata_accepted",
    "metadata_chain_sha256", "prior_ack_sequence",
    "prior_committed_record_sequence", "prior_ack_sha256";
  uint32 next_ordinal = 3;
  bytes value_chain_sha256 = 6;
}

message BackupConfigCredit {
  WorkAttemptIdentity attempt = 1;
  uint32 source_ordinal = 2;
  bytes authority_digest = 3;
  string transfer_id = 4;
  BackupConfigDirection direction = 5;
  uint64 credit_sequence = 6;
  oneof credit {
    BackupConfigMetadataAccepted metadata_accepted = 10;
    BackupConfigValueCredit value_credit = 11;
    BackupConfigMetadataCredit metadata_credit = 16;
  }
  uint64 committed_record_sequence = 12;
  uint32 next_ordinal = 13;
  bytes cumulative_chain_sha256 = 14;
  bytes ack_sha256 = 15;
}

enum BackupVolumeManifestDirection {
  BACKUP_VOLUME_MANIFEST_DIRECTION_UNSPECIFIED = 0;
  BACKUP_VOLUME_MANIFEST_DIRECTION_CAPTURE = 1; // Agent to Controller
  BACKUP_VOLUME_MANIFEST_DIRECTION_RESTORE_NEW = 2; // Controller to Agent
  BACKUP_VOLUME_MANIFEST_DIRECTION_RESTORE_OLD = 3; // Agent to Controller
}

enum BackupVolumeManifestRole {
  BACKUP_VOLUME_MANIFEST_ROLE_UNSPECIFIED = 0;
  BACKUP_VOLUME_MANIFEST_ROLE_CAPTURED = 1;
  BACKUP_VOLUME_MANIFEST_ROLE_RESTORE_NEW = 2;
  BACKUP_VOLUME_MANIFEST_ROLE_STOPPED_LIVE_OLD = 3;
}

message BackupVolumeManifestTransfer {
  WorkAttemptIdentity attempt = 1;
  uint32 source_ordinal = 2;
  reserved 3;
  bytes authority_digest = 4;
  string transfer_id = 5;
  BackupVolumeManifestDirection direction = 6;
  uint64 record_sequence = 7;
  oneof record {
    BackupVolumeManifestStart start = 10;
    BackupVolumeManifestBatch batch = 11;
    BackupVolumeManifestEnd end = 12;
    BackupVolumeManifestResume resume = 13;
  }
