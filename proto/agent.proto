message BackupTaskAuthority {
  uint32 authority_schema = 1; // exactly one
  string task_id = 2;
  string operation_id = 3;
  uint32 task_attempt = 4;
  bytes plan_hash = 5;
  string project_id = 6;
  RevisionDigest project = 7;
  string environment_id = 8;
  RevisionDigest environment = 9;
  uint64 task_deadline_unix_nano = 10; // absolute, never extended on reconnect
  string assignment_id = 11;
  uint64 assignment_generation = 12;
  repeated BackupServiceFact services = 13;
  repeated BackupStepAuthority steps = 14;
}

// Sealed once during publication. Assignment adds only its exact delivery
// identity and absolute claim deadline; reconnect never rereads live resources.
// Captured Backup work has no attempt, assignment or generic plan identity.
// Delivery binds this payload through WorkAttemptIdentity.input; retries retain
// the payload and add a new attempt rather than rewriting source authority.
message BackupWorkInput {
  uint32 schema = 1;
  BackupWorkOperation operation = 2;
  string project_id = 3;
  RevisionDigest project = 4;
  string environment_id = 5;
  RevisionDigest environment = 6;
  repeated BackupServiceFact services = 7;
  repeated BackupStepAuthority steps = 8;
  repeated ComposeArtifact artifacts = 9;
}

enum BackupWorkOperation {
  BACKUP_WORK_OPERATION_UNSPECIFIED = 0;
  BACKUP_WORK_OPERATION_CAPTURE = 1;
  BACKUP_WORK_OPERATION_RESTORE = 2;
  BACKUP_WORK_OPERATION_PRUNE = 3;
}

// Reconnect repeats the same attempt and the Controller's durable source
// cursors. An Agent may not substitute locally remembered progress.
message BackupWorkAssignment {
  WorkAttemptIdentity attempt = 1;
  BackupWorkInput input = 2;
  repeated BackupStepResume sources = 3;
}

// Native Volume consumer command. Inspection uses the same captured workload;
// mutation additionally requires the exact acknowledged source intent.
message BackupConsumerHelperRequest {
  BackupWorkAssignment assignment = 1;
  uint32 source_ordinal = 2;
  string service_id = 3;
  WorkStartAck start = 4;
  bool inspect_only = 5;
  BackupConsumerOperation operation = 6;
  BackupWorkCheckpointRequest checkpoint = 7;
  BackupWorkCheckpointAck acknowledgement = 8;
  BackupRecoveryAssignment recovery = 9;
}

message BackupConsumerHelperResponse {
  WorkAttemptIdentity attempt = 1;
  uint32 source_ordinal = 2;
  string service_id = 3;
  bool inspection = 4;
  ObservedProject observed = 5;
  bytes observation_sha256 = 6;
  google.protobuf.Timestamp observed_at = 7;
}

// Recovery uses captured progress; it never grants forward execution again.
enum BackupRestoreRecoveryMode {
  BACKUP_RESTORE_RECOVERY_MODE_UNSPECIFIED = 0;
  BACKUP_RESTORE_RECOVERY_MODE_NO_LIVE_MUTATION = 1;
  BACKUP_RESTORE_RECOVERY_MODE_LIVE_MUTATION = 2;
}

message BackupRecoveryAssignment {
  WorkAttemptIdentity attempt = 1;
  BackupWorkInput input = 2;
  bytes recovery_source = 3;
  repeated BackupStepResume sources = 4;
  BackupRestoreRecoveryMode restore_mode = 5;
}

message BackupRecoveryRequest {
  WorkAttemptIdentity attempt = 1;
  bytes report = 2;
}

// The Agent must obtain this publication acknowledgement before materializing
// the captured Config generation during recovery.
message BackupConfigRecoveryPrepareRequest {
  WorkAttemptIdentity attempt = 1;
  uint32 source_ordinal = 2;
}

message BackupConfigRecoveryPrepareAck {
  BackupRecoveryAssignment assignment = 1;
  uint32 source_ordinal = 2;
  BackupConfigTransferCompleted completed = 3;
