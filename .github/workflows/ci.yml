name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOCACHE: ${{ github.workspace }}/.tmp/go-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          bash scripts/repo-env.sh npm install --global "$(node -p 'require("./console/package.json").packageManager')"
      - name: Run checks
        run: make ci
