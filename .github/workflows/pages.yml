name: Public installation site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Test and stage public site
        run: |
          bash scripts/repo-env.sh python3 -m unittest discover -s scripts -p test_build_pages.py
          bash scripts/repo-env.sh python3 scripts/build_pages.py
          cmp install.sh .tmp/pages-build/site/install.sh
          cd .tmp/pages-build/site
          sha256sum --check install.sh.sha256
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .tmp/pages-build/site
          include-hidden-files: true
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
