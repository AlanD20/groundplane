name: Release

on:
  push:
    tags: ['v*', 'agent/v*', 'controller/v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: groundplane-release-publication
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      repository: ${{ steps.version.outputs.repository }}
      scope: ${{ steps.version.outputs.scope }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        name: Require a release tag on main
        env:
          RELEASE_REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          tag=${RELEASE_REF#refs/tags/}
          [[ "$tag" =~ ^((agent|controller)/)?v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          scope=both
          [[ "$tag" != agent/* ]] || scope=agent
          [[ "$tag" != controller/* ]] || scope=controller
          version=${tag##*/}
          version=${version#v}
          git merge-base --is-ancestor HEAD origin/main
          python3 scripts/release_publish.py "$tag" --check
          if [[ "$scope" != agent ]]; then python3 scripts/bump_version.py "$version" --check; fi
          {
            echo "version=$version"
            echo "scope=$scope"
            echo "repository=${REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  images:
    needs: [version, checks]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE_ROOT: ghcr.io/${{ needs.version.outputs.repository }}
      ARCH: ${{ matrix.arch }}
      SCOPE: ${{ needs.version.outputs.scope }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, smoke-test and push native images
        run: |
          mkdir -p .tmp/release-images
          if [[ "$SCOPE" != controller ]]; then
            bash scripts/release-agent.sh --version "agent/v$VERSION" \
              --image "$IMAGE_ROOT-agent:v$VERSION-$ARCH" --push > ".tmp/release-images/agent-$ARCH"
          fi
          if [[ "$SCOPE" != agent ]]; then
            make runner-image-smoke RUNNER_IMAGE="$IMAGE_ROOT-runner:v$VERSION-$ARCH"
            docker push "$IMAGE_ROOT-runner:v$VERSION-$ARCH"
            docker image inspect "$IMAGE_ROOT-runner:v$VERSION-$ARCH" \
              --format '{{index .RepoDigests 0}}' > ".tmp/release-images/runner-$ARCH"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: images-${{ matrix.arch }}
          path: .tmp/release-images/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  indexes:
    needs: [version, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      agent: ${{ steps.indexes.outputs.agent }}
      runner: ${{ steps.indexes.outputs.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: images-*
          merge-multiple: true
          path: .tmp/release-images
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: indexes
        name: Publish and verify two-platform indexes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IMAGE_ROOT: ghcr.io/${{ needs.version.outputs.repository }}
          RELEASE_SCOPE: ${{ needs.version.outputs.scope }}
        run: bash scripts/repo-env.sh python3 scripts/release_indexes.py
      - name: Require anonymous image access for the installer
        env:
          AGENT_IMAGE: ${{ steps.indexes.outputs.agent }}
          RUNNER_IMAGE: ${{ steps.indexes.outputs.runner }}
        run: |
          docker logout ghcr.io
          if [[ -n "$AGENT_IMAGE" ]]; then docker manifest inspect "$AGENT_IMAGE" > /dev/null; fi
          if [[ -n "$RUNNER_IMAGE" ]]; then docker manifest inspect "$RUNNER_IMAGE" > /dev/null; fi
      - name: Package Agent-only installation artifacts
        if: needs.version.outputs.scope != 'controller'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          AGENT_IMAGE: ${{ steps.indexes.outputs.agent }}
        run: bash scripts/repo-env.sh python3 scripts/release_agent_bundle.py --version "$VERSION" --image "$AGENT_IMAGE"
      - uses: actions/upload-artifact@v7
        if: needs.version.outputs.scope != 'controller'
        with:
          name: agent-bundles
          path: .tmp/releases/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  bundles:
    if: needs.version.outputs.scope != 'agent'
    needs: [version, indexes]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
      AGENT_IMAGE: ${{ needs.indexes.outputs.agent }}
      RUNNER_IMAGE: ${{ needs.indexes.outputs.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Build native bundle with the pinned npm version
        run: |
          bash scripts/repo-env.sh npm install --global "$(node -p 'require("./console/package.json").packageManager')"
          args=(--version "$VERSION" --runner-image "$RUNNER_IMAGE")
          if [[ -n "$AGENT_IMAGE" ]]; then args+=(--agent-image "$AGENT_IMAGE"); else args+=(--controller-only); fi
          bash scripts/repo-env.sh python3 scripts/release_bundle.py "${args[@]}"
          cd .tmp/releases
          sha256sum --check -- *.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.arch }}
          path: .tmp/releases/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [version, indexes, bundles]
    if: always() && needs.indexes.result == 'success' && (needs.bundles.result == 'success' || needs.bundles.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: '*bundle*'
          merge-multiple: true
          path: .tmp/releases
      - name: Publish complete assets without overwriting a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd .tmp/releases
          sha256sum --check -- *.sha256
          cd ../..
          bash scripts/repo-env.sh python3 scripts/release_publish.py "$RELEASE_TAG"
