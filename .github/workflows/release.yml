name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      repository: ${{ steps.version.outputs.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        name: Require a release tag on main
        env:
          RELEASE_REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          [[ "$RELEASE_REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor HEAD origin/main
          python3 scripts/bump_version.py "${RELEASE_REF#refs/tags/v}" --check
          echo "version=${RELEASE_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          echo "repository=${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  images:
    needs: [version, checks]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE_ROOT: ghcr.io/${{ needs.version.outputs.repository }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, smoke-test and push native images
        run: |
          mkdir -p .tmp/release-images
          bash scripts/release-agent.sh --version "$VERSION" \
            --image "$IMAGE_ROOT-agent:$VERSION-$ARCH" --push > ".tmp/release-images/agent-$ARCH"
          make runner-image-smoke RUNNER_IMAGE="$IMAGE_ROOT-runner:$VERSION-$ARCH"
          docker push "$IMAGE_ROOT-runner:$VERSION-$ARCH"
          docker image inspect "$IMAGE_ROOT-runner:$VERSION-$ARCH" \
            --format '{{index .RepoDigests 0}}' > ".tmp/release-images/runner-$ARCH"
      - uses: actions/upload-artifact@v7
        with:
          name: images-${{ matrix.arch }}
          path: .tmp/release-images/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  indexes:
    needs: [version, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      agent: ${{ steps.indexes.outputs.agent }}
      runner: ${{ steps.indexes.outputs.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: images-*
          merge-multiple: true
          path: .tmp/release-images
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: indexes
        name: Publish and verify two-platform indexes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IMAGE_ROOT: ghcr.io/${{ needs.version.outputs.repository }}
        run: bash scripts/repo-env.sh python3 scripts/release_indexes.py
      - name: Require anonymous image access for the installer
        env:
          AGENT_IMAGE: ${{ steps.indexes.outputs.agent }}
          RUNNER_IMAGE: ${{ steps.indexes.outputs.runner }}
        run: |
          docker logout ghcr.io
          docker manifest inspect "$AGENT_IMAGE" > /dev/null
          docker manifest inspect "$RUNNER_IMAGE" > /dev/null

  bundles:
    needs: [version, indexes]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
      AGENT_IMAGE: ${{ needs.indexes.outputs.agent }}
      RUNNER_IMAGE: ${{ needs.indexes.outputs.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Build native bundle with the pinned npm version
        run: |
          bash scripts/repo-env.sh npm install --global "$(node -p 'require("./console/package.json").packageManager')"
          bash scripts/repo-env.sh python3 scripts/release_bundle.py --version "$VERSION" \
            --agent-image "$AGENT_IMAGE" --runner-image "$RUNNER_IMAGE"
          cd .tmp/releases
          sha256sum --check -- *.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.arch }}
          path: .tmp/releases/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [version, bundles]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          merge-multiple: true
          path: .tmp/releases
      - name: Publish complete assets without overwriting a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 scripts/bump_version.py "$VERSION" --notes > .tmp/release-notes.md
          cd .tmp/releases
          sha256sum --check -- *.sha256
          gh release create "v$VERSION" --verify-tag --title "Groundplane $VERSION" \
            --notes-file ../release-notes.md \
            "groundplane-$VERSION-linux-amd64.tar.gz" "groundplane-$VERSION-linux-amd64.tar.gz.sha256" \
            "groundplane-$VERSION-linux-arm64.tar.gz" "groundplane-$VERSION-linux-arm64.tar.gz.sha256" \
            ../../install.sh

  pages:
    needs: [version, publish]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      version: ${{ needs.version.outputs.version }}
